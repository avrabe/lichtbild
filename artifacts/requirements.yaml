artifacts:
  # ============================================================
  # lichtbild requirements. Step 2 of docs/BRIEF.md (the skeleton) is
  # release v0.1.0; later steps are seeded so the hazards that only
  # they can violate already have a requirement to land against.
  # ============================================================

  # --- Process ---
  - id: REQ-TRACE-001
    type: requirement
    title: Artifacts are tracked with rivet and validated in CI
    status: implemented
    release: v0.1.0
    description: >
      Losses, hazards, constraints, requirements, decisions and tests live in
      artifacts/, and `rivet validate` runs in CI on every pull request and
      push, with rivet taken from the varve-pinned layer.
    fields:
      priority: must
      category: constraint

  - id: REQ-FAULT-001
    type: requirement
    title: Every safety and security check is shown to fail on a planted fault
    status: implemented
    release: v0.1.0
    description: >
      For each test that verifies a constraint, the repository records a
      planted fault (a one-line change to the code under test) and shows the
      test fails with it. The list lives in docs/planted-faults.md and is
      re-run before each release.
    fields:
      priority: must
      category: constraint
    links:
      - type: derives-from
        target: REQ-TRACE-001

  - id: REQ-PRIV-001
    type: requirement
    title: Fixtures are synthetic and the hostname scan guards every change
    status: implemented
    release: v0.1.0
    description: >
      Test images and videos are generated by the tests themselves (or are
      public domain with a recorded source). The hostname-scan workflow runs
      on every pull request, merge group and push to main.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-006

  - id: REQ-REL-001
    type: requirement
    title: Releases are signed binaries the deployment can pin
    status: implemented
    release: v0.1.0
    description: >
      A version tag builds static linux-arm64 and linux-amd64 binaries and a
      macos-arm64 binary, a CycloneDX SBOM, SHA256SUMS.txt with a keyless
      cosign signature, and a build-provenance attestation per binary, with
      the same asset names haus uses. The binary reports the tag version.
    fields:
      priority: must
      category: interface

  # --- Configuration ---
  - id: REQ-CFG-001
    type: requirement
    title: Configuration comes from the environment and a file, never from the repository
    status: implemented
    release: v0.1.0
    description: >
      Source roots (each with a person label), the data directory, the base
      path, the listen address and limits are read from LICHTBILD_* variables
      and an optional TOML file named by LICHTBILD_CONFIG. The repository
      carries only an example with placeholder values. A missing root or
      data directory stops startup with a clear error; lichtbild creates no
      directory at startup.
    fields:
      priority: must
      category: interface
    links:
      - type: satisfies
        target: SSC-006

  - id: REQ-CFG-002
    type: requirement
    title: Startup refuses a data directory that overlaps a source root
    status: implemented
    release: v0.1.0
    description: >
      After resolving symlinks, lichtbild exits with an error when the data
      directory lies inside a source root, a source root lies inside the
      data directory, or two roots overlap.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001

  # --- Scan ---
  - id: REQ-SCAN-001
    type: requirement
    title: The scan opens source files read-only and changes nothing in a root
    status: implemented
    release: v0.1.0
    description: >
      All access to source roots goes through one module that only lists
      directories, reads metadata and opens files for reading. A test builds
      a synthetic tree, records listing, size, mode, mtime and sha256 of
      every entry, runs a full scan and thumbnail pass, and requires the
      record to be identical afterwards. The test also runs with the tree
      made read-only.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001

  - id: REQ-SCAN-002
    type: requirement
    title: The scan reports found, indexed and skipped files that reconcile
    status: implemented
    release: v0.1.0
    description: >
      `lichtbild scan` prints, per root and in total, files found, indexed
      and skipped, and the skipped ones by reason (unsupported type,
      unreadable, decode error, over size limit, symlink outside root,
      hidden or system file). It writes the same report as JSON. It exits
      non-zero when found differs from indexed plus skipped. The report
      names counts and extensions, never file paths, so it can be shared.
      Indexed items without a thumbnail are counted by reason and format.
      The operator's list of every skipped file and missing thumbnail, with
      paths, is written to scan-problems.tsv in the data directory only.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-002

  - id: REQ-SCAN-003
    type: requirement
    title: Scans are idempotent and resume after interruption
    status: implemented
    release: v0.1.0
    description: >
      A file is identified by root and root-relative path; change is detected
      by size and modification time, then content hash. A second scan of an
      unchanged tree makes no index change. A scan killed part-way and run
      again yields the same index as one full run. Files that disappeared are
      marked missing.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003

  - id: REQ-SCAN-004
    type: requirement
    title: Indexing runs with bounded workers at low priority
    status: implemented
    release: v0.1.0
    description: >
      The scan uses a configured worker count (default 2) and lowers its own
      CPU and I/O priority at start. Decoders get a pixel limit and a file
      size limit; files over them are skipped with a reason.
    fields:
      priority: must
      category: non-functional
    links:
      - type: constraint-satisfies
        target: SC-005

  - id: REQ-SCAN-005
    type: requirement
    title: Symlinks that leave their root are skipped and reported
    status: implemented
    release: v0.1.0
    description: >
      The scan does not follow a symlink whose target resolves outside its
      root; it counts it as skipped with reason "symlink outside root".
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-004

  # --- Index and metadata ---
  - id: REQ-IDX-001
    type: requirement
    title: The index is one redb database in the data directory, owned by one process
    status: implemented
    release: v0.1.0
    description: >
      Items, their source, capture date, position and derived-file state are
      stored in redb inside the data directory, with a schema version checked
      on startup. `lichtbild serve` holds the index and scans in the
      background; `lichtbild scan` refuses with a clear message while
      another process holds it.
    fields:
      priority: must
      category: functional

  - id: REQ-META-001
    type: requirement
    title: Capture date and position are stored with their source
    status: implemented
    release: v0.1.0
    description: >
      Capture date is taken from EXIF DateTimeOriginal with its offset, then
      other EXIF dates, then a date in the file name, then the file time,
      and the index records which one was used. Position is taken from EXIF
      GPS only when a fix is present; otherwise it is null. The timeline
      marks items whose date did not come from EXIF.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-004

  # --- Thumbnails ---
  - id: REQ-THUMB-001
    type: requirement
    title: Thumbnails are written atomically into a bounded cache in the data directory
    status: implemented
    release: v0.1.0
    description: >
      Thumbnails are generated in the data directory, written to a temporary
      name and renamed into place, keyed by content hash, honour the EXIF
      orientation, and the cache has a configured size cap. A thumbnail that
      cannot be generated is recorded with its reason and counted in the
      report.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003
      - type: constraint-satisfies
        target: SC-005

  # --- Web ---
  - id: REQ-WEB-001
    type: requirement
    title: A server-rendered timeline grouped by year, month and day
    status: implemented
    release: v0.1.0
    description: >
      `lichtbild serve` renders a timeline page per person and, when asked,
      merged, newest first, grouped by year, month and day, loading further
      days with htmx through keyset pagination so that tens of thousands of
      items scroll without loading all at once. Static assets are embedded.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-002
    type: requirement
    title: The app works under a configurable base path
    status: implemented
    release: v0.1.0
    description: >
      All links, assets and htmx requests are prefixed with LICHTBILD_BASE_PATH
      so the app can sit behind the house reverse proxy under a path, as haus
      does with HAUS_BASE_PATH.
    fields:
      priority: must
      category: interface

  - id: REQ-WEB-003
    type: requirement
    title: Pages load nothing from another host
    status: implemented
    release: v0.1.0
    description: >
      Every HTML response carries a Content-Security-Policy whose sources are
      'self' only, and pages use no inline style or script. A test renders
      each page and embedded asset and fails on any absolute http(s) URL to
      another host. The one exception is the operator's nav file,
      whose entries may link to other house apps: they are rendered only as
      links a person follows, never as resources the page loads.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-003

  - id: REQ-WEB-004
    type: requirement
    title: Files are served by item id only
    status: implemented
    release: v0.1.0
    description: >
      Thumbnail and original routes take an item id, look up the stored
      root-relative path, resolve it and refuse it unless it lies inside its
      root. No route accepts a path.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-004

  - id: REQ-WEB-005
    type: requirement
    title: Requests are answered only for localhost and configured host names
    status: implemented
    release: v0.1.0
    description: >
      Until login exists, a request whose Host (or authority) is not
      localhost, 127.0.0.1, ::1 or a name in LICHTBILD_ALLOWED_HOSTS gets 421
      and no library data, so a page on another site cannot read lichtbild
      through DNS rebinding.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-001

  - id: REQ-WEB-006
    type: requirement
    title: Jump to any year or month of a timeline
    status: implemented
    release: v0.2.0
    description: >
      Every timeline page offers a date scrubber: on wide screens a rail along
      the right edge with one tick per month that has items, sized by the
      number of items and labelled on hover; on phones a "Jump to date" menu
      of years and months. Choosing a year or month starts the timeline
      there, with a link back to newer photos. Both work as plain links.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-007
    type: requirement
    title: A photo viewer that steps to the previous and next photo
    status: implemented
    release: v0.2.0
    description: >
      Choosing a photo opens it large. Previous (newer) and next (older)
      follow the order of the timeline it was opened from, by link, arrow
      key or horizontal swipe; Escape and the back link return to the
      timeline at that photo. A photo is shown only in a timeline it belongs
      to.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-008
    type: requirement
    title: The viewer shows a photo's details on request
    status: implemented
    release: v0.1.3
    description: >
      An info panel in the viewer, opened by a button or the i key and
      working without JavaScript, shows when the photo was taken and where
      that date came from, where it was taken, the camera, lens and exposure
      read from the original's EXIF, the size, file name and library.
    fields:
      priority: should
      category: functional

  - id: REQ-PLACE-002
    type: requirement
    title: Pictures without a recorded position are placed, as estimates or by hand
    status: implemented
    release: v0.6.1
    description: >
      A picture whose file records no position takes one from the pictures
      of the same library taken shortly before and after it, and is shown
      as estimated, with how far off it may be, on the map, in the viewer
      and in search. The owner of a library can set a picture's position
      on the map by hand, which then places its neighbours in time too,
      and can forget it again. A position never comes from another
      library, estimates never place other pictures, a recorded position
      always wins, and nothing is written to the source files.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002
      - type: satisfies
        target: SC-001

  - id: REQ-TEXT-001
    type: requirement
    title: Text in pictures is read in the house, searched and shown where it is
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19. lichtbild reads the text in photos (signs,
      letters, receipts, menus) in German and other Latin-script languages,
      umlauts and ß included, without sending anything out of the house. It
      keeps each line with its place on the picture, groups lines into
      blocks and blocks into separate documents (one photo can hold
      several), and drops what textures make look like text. Search finds
      pictures by their text and shows the matching lines; the viewer
      lists the text by document to read and copy, and marks each line on
      the picture, the matching ones first; a line searches for itself.
      Reading runs in a separate, limited process after the scan, each
      picture once per model, and the model files are pinned by hash.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SC-001

  - id: REQ-SEE-001
    type: requirement
    title: Things in pictures are found, searched by name and shown where they are
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19. lichtbild finds the common kinds of thing in
      photos (people, animals, vehicles, food, furniture and more), in the
      house, with their place on the picture, keeping only confident
      finds. Search knows them by their German and English names; the
      viewer lists them, each a search, and marks them on the picture.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003

  - id: REQ-SEE-002
    type: requirement
    title: Pictures are found by what they show, and by what they look like
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19 (usability beyond the big photo apps). A
      search in plain words, German or English ("zwei Katzen auf dem
      Sofa"), also finds the pictures that show it, after the exact hits,
      and only those that match well. The viewer shows the pictures that
      look like the one shown. Pictures and words are compared in the
      house; nothing leaves it. Only the viewer's libraries count.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-009
    type: requirement
    title: A status page says what the server is doing
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19: the scan's state should be visible. A status
      page shows whether a scan or the transcription pass runs now (with
      its progress), when the last scan ended, how long it took and what it
      found, how many videos have a transcript, the duplicate groups, the
      search documents, whether a map file and place names are configured,
      and the version and uptime. It refreshes itself and shows counts and
      times only, never paths, file names or error text; transcript counts
      cover the viewer's libraries, and totals over all libraries are shown
      only to someone who may see all of them.
    fields:
      priority: should
      category: functional

  - id: REQ-WEB-010
    type: requirement
    title: Timelines, search and the map can show only photos or only videos
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. An All / Photos / Videos switch on the
      timelines, the search results and the map. The choice stays when the
      timeline loads more, when the date chooser jumps and when the map
      changes library.
    fields:
      priority: should
      category: functional

  - id: REQ-WEB-011
    type: requirement
    title: One menu reaches every page, and the home page shows the libraries
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. Every signed-in page carries the same menu
      button beside the name, listing home, map, words, hidden, duplicate
      files, status and sign-out, so no page is a dead end. The home page
      shows a card per library (and one for everyone) with its newest
      pictures, count and years, the pictures taken on this day in earlier
      years, and tiles for the map, words and status.
    fields:
      priority: should
      category: functional

  - id: REQ-WORDS-001
    type: requirement
    title: The words said in videos, as a cloud that searches
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. A page shows the words most of the viewer's
      videos share, read from their transcripts, sized by how many videos
      say them, without common German and English words; a word opens the
      search for it. Only libraries the viewer may see count.
    fields:
      priority: could
      category: functional

  - id: REQ-PLACE-001
    type: requirement
    title: Positions are named offline, never by an outside service
    status: implemented
    release: v0.1.3
    description: >
      When the deployment supplies GeoNames files (towns with 1,000 or more
      inhabitants, optional region and country names), the info panel names
      the nearest town within about two degrees, with its distance, from an
      index lichtbild holds in memory. No position is sent to any other host.
      Without the files only coordinates are shown.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003

  # --- Later steps (seeded, not in v0.1.0) ---
  - id: REQ-AUTH-001
    type: requirement
    title: Login through the house OIDC provider, deny by default
    status: implemented
    release: v0.2.0
    description: >
      With an OIDC issuer configured, every route except the health check,
      the embedded static assets and the login routes needs a session from
      the authorization code flow with PKCE; anything else is redirected to
      the provider (htmx requests get 401 with HX-Redirect). The ID token's
      signature, issuer, audience, expiry and nonce are verified; a callback
      for an unknown or used state is refused; an identity that is not one
      of the configured people gets 403 and no session. Session cookies are
      random, HttpOnly, SameSite=Lax, and Secure behind https. Without an
      issuer configured, serve stays on loopback only.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-001

  - id: REQ-AUTH-002
    type: requirement
    title: Each person sees their own library; other libraries and the merged view only by grant
    status: implemented
    release: v0.2.0
    description: >
      People map to source roots by OIDC subject or verified email. A person
      sees their own library and those listed in their `sees` grant (owner
      decision 2026-11-17: own only by default). Timelines, the viewer,
      thumbnails, previews and originals are all checked against the viewer;
      the merged view exists only for a person who may see more than one
      library.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-NAV-001
    type: requirement
    title: Render the shared nav v1 app switcher
    status: implemented
    release: v0.2.0
    description: >
      With LICHTBILD_NAV (the nav v1 file) and LICHTBILD_NAV_SELF (this app's
      id) set, every page's header shows the home link and the app switcher,
      this app marked as current, exactly as haus and warte render it
      (contract: warte docs nav, since warte v1.6.25). Both settings or
      neither; a file that breaks the contract stops startup naming the field.
    fields:
      priority: should
      category: interface

  - id: REQ-MAP-001
    type: requirement
    title: World map from a local PMTiles file, served by lichtbild
    status: implemented
    description: >
      Photos and videos with a position are shown on a map at /map,
      clustered by zoom on the server and scoped to the viewer exactly like
      the timeline: a person never sees, counts or locates an item of a
      library they may not see. Tiles come from one Protomaps PMTiles file
      the deployment provides (LICHTBILD_MAP_PMTILES), served by lichtbild
      with byte ranges; glyphs and sprites from a deployment directory
      (LICHTBILD_MAP_ASSETS) whose requests are confined to it. MapLibre,
      pmtiles and the Protomaps style are vendored at pinned versions and
      sha256 and served by lichtbild, so the browser makes no request to
      another host and the CSP stays 'self' only. Without a PMTiles file the
      page says so; without the assets directory the map has no labels.
      The map shows "© OpenStreetMap" and works under the base path.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SSC-002
      - type: satisfies
        target: SSC-004

  - id: REQ-MEDIA-001
    type: requirement
    title: MP4 and MOV video with poster frames, length and streaming
    status: implemented
    release: v0.3.0
    description: >
      MP4, M4V, 3GP and MOV videos are indexed with their length, codec,
      capture date (Apple keys with offset, else the container's UTC time)
      and position (Apple keys or ©xyz). H.264 and HEVC (8 and 10 bit) get a
      poster from their first keyframe, rotated as the track says; other
      codecs are indexed without one and counted by codec. Only the moov
      index and one keyframe are read, both capped; the decoders run in a
      separate process under a timeout and CPU and memory limits. The
      viewer plays the original, which is served with byte ranges.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-MEDIA-003
    type: requirement
    title: Motion Photos play their embedded clip
    status: draft
    description: >
      Pixel and Samsung Motion Photos (a JPEG with an MP4 appended) and
      Apple Live Photos (a HEIC next to a MOV of the same name) show their
      clip in the viewer. Split from the video requirement at v0.3.0.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-MEDIA-002
    type: requirement
    title: HEIC photos are indexed and shown, decoded in memory-safe code
    status: implemented
    release: v0.1.3
    description: >
      HEIC and HEIF stills (single images and tile grids, with rotation and
      mirror applied) are indexed like JPEGs: dimensions, EXIF date and
      position, a thumbnail, and a JPEG preview of at most 2048 px that the
      viewer shows, because most browsers cannot display HEIC. Decoding is
      pure Rust without unsafe code, under the pixel limit; a file it cannot
      decode is skipped as "decode error (heic)".
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-FACE-001
    type: requirement
    title: Face and similarity models run locally and are pinned by sha256
    status: draft
    description: >
      Model files come from the deployment, are checked against a pinned
      sha256 before loading and run in-process; nothing is downloaded at run
      time.
    fields:
      priority: could
      category: constraint
    links:
      - type: satisfies
        target: SSC-007

  - id: REQ-MEDIA-004
    type: requirement
    title: Speech in videos is transcribed in the house, with times
    status: implemented
    release: v0.4.0
    description: >
      After each scan, videos without a transcript from the configured
      Whisper model are transcribed one at a time, in a separate process
      under a timeout and CPU and memory limits, until the next scan is due.
      Transcripts carry a time and language per line, are stored per content
      hash, and are shown in the viewer, where a time seeks the video. The
      model files are pinned by SHA-256 and checked at startup. No audio,
      text or request leaves the house. Silence, tones and music give no
      text rather than invented text.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-SEARCH-001
    type: requirement
    title: One search box over what was said, places, dates and names
    status: implemented
    release: v0.4.0
    description: >
      A search box in every page's header finds items by words spoken in
      their videos, the nearest town, the year and month (German and
      English), and file and folder names. A spoken hit links to its moment
      in the video. Results come only from the libraries the viewer may
      see, enforced in the query.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-SEARCH-002
    type: requirement
    title: The search box suggests what the libraries hold as it is typed
    status: implemented
    release: v0.7.0
    description: >
      While a word is typed into the search box, a list under it offers
      completions of the last word: things found in pictures (German, found
      by their English name too), places, years and months, and words said
      in videos or written in pictures, each with how many items hold it.
      Earlier words of the query are kept, and a completion that would find
      nothing together with them is not offered. Only terms that items in the
      libraries the viewer may see hold are offered; common words and a
      single letter offer nothing. The results page keeps the query in the
      box so it can be refined.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-012
    type: requirement
    title: Photos taken one after another that look alike show as one series
    status: implemented
    release: v0.7.0
    description: >
      In the timeline, photos of one day, each taken at most two minutes
      after the one before and looking alike by their picture vectors
      (cosine at least 0.92), show as one tile with a count: a burst, or
      the same scene taken again. The count opens the rest of the series in
      place and closes it again; the tile still opens the viewer, whose
      arrows pass through every photo. Without picture vectors nothing is
      grouped.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-013
    type: requirement
    title: A slideshow from any photo on
    status: implemented
    release: v0.7.0
    description: >
      The viewer starts a slideshow from the photo shown (button or key s):
      the timeline's photos from there on, older and older, one every five
      seconds, cross-faded and loaded ahead, full screen where the browser
      allows it. It shows one photo of each series, no videos, and nothing
      the viewer hid or may not see. A tap or the space bar pauses, arrows
      and swipes step, Escape closes to the viewer at the photo last shown;
      the screen stays on while it plays where the browser allows it.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-SEARCH-003
    type: requirement
    title: Search results offer terms that narrow them down
    status: implemented
    release: v0.7.0
    description: >
      Above four or more results, the results page offers the things found
      in them, their places and their years that some but not all results
      hold, with how many hold each: up to four things, three places and
      four years, the most held first. Each is a link to the query with the
      term added, keeping the photo/video filter; terms already in the
      query are not offered.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-001
    type: requirement
    title: The same picture is shown once, as its best copy
    status: implemented
    release: v0.5.0
    description: >
      Exact copies (same content) and the same picture in another file (a
      messenger copy without its camera date, a resized export, the JPEG
      twin of a HEIC) are grouped. Timeline, search and map show one copy
      of each group: the best one the viewer may see (camera date, position,
      pixels, file size), with the number of copies; the viewer lists them.
      Shots of a burst are not grouped. Nothing in the libraries changes.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-002
    type: requirement
    title: Each person can hide what they do not want to see
    status: implemented
    release: v0.5.0
    description: >
      In the viewer a person can hide an item, or keep one copy of a
      duplicate group and hide the others. Hidden items leave that person's
      timeline, search and map; a "Hidden" page shows them again. One
      person's choice never changes another's view, an item in a library
      the person may not see cannot be hidden, another site's form cannot
      hide anything, and nothing in the libraries changes.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-003
    type: requirement
    title: A list of duplicate files to clean up, for one's own library
    status: implemented
    release: v0.5.0
    description: >
      A page and a CSV list exact duplicate files (same content) in the
      libraries a person owns, with the copy to keep and the space the
      others take. Only one's own library's paths are listed, never those
      of a library one was granted. lichtbild deletes nothing.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

