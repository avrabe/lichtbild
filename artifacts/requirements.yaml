artifacts:
  # ============================================================
  # lichtbild requirements. Step 2 of docs/BRIEF.md (the skeleton) is
  # release v0.1.0; later steps are seeded so the hazards that only
  # they can violate already have a requirement to land against.
  # ============================================================

  # --- Process ---
  - id: REQ-TRACE-001
    type: requirement
    title: Artifacts are tracked with rivet and validated in CI
    status: implemented
    release: v0.1.0
    description: >
      Losses, hazards, constraints, requirements, decisions and tests live in
      artifacts/, and `rivet validate` runs in CI on every pull request and
      push, with rivet taken from the varve-pinned layer.
    fields:
      priority: must
      category: constraint

  - id: REQ-FAULT-001
    type: requirement
    title: Every safety and security check is shown to fail on a planted fault
    status: implemented
    release: v0.1.0
    description: >
      For each test that verifies a constraint, the repository records a
      planted fault (a one-line change to the code under test) and shows the
      test fails with it. The list lives in docs/planted-faults.md and is
      re-run before each release.
    fields:
      priority: must
      category: constraint
    links:
      - type: derives-from
        target: REQ-TRACE-001

  - id: REQ-PRIV-001
    type: requirement
    title: Fixtures are synthetic and the hostname scan guards every change
    status: implemented
    release: v0.1.0
    description: >
      Test images and videos are generated by the tests themselves (or are
      public domain with a recorded source). The hostname-scan workflow runs
      on every pull request, merge group and push to main.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-006

  - id: REQ-REL-001
    type: requirement
    title: Releases are signed binaries the deployment can pin
    status: implemented
    release: v0.1.0
    description: >
      A version tag builds static linux-arm64 and linux-amd64 binaries and a
      macos-arm64 binary, a CycloneDX SBOM, SHA256SUMS.txt with a keyless
      cosign signature, and a build-provenance attestation per binary, with
      the same asset names haus uses. The binary reports the tag version.
    fields:
      priority: must
      category: interface

  # --- Configuration ---
  - id: REQ-CFG-001
    type: requirement
    title: Configuration comes from the environment and a file, never from the repository
    status: implemented
    release: v0.1.0
    description: >
      Source roots (each with a person label), the data directory, the base
      path, the listen address and limits are read from LICHTBILD_* variables
      and an optional TOML file named by LICHTBILD_CONFIG. The repository
      carries only an example with placeholder values. A missing root or
      data directory stops startup with a clear error; lichtbild creates no
      directory at startup.
    fields:
      priority: must
      category: interface
    links:
      - type: satisfies
        target: SSC-006

  - id: REQ-CFG-002
    type: requirement
    title: Startup refuses a data directory that overlaps a source root
    status: implemented
    release: v0.1.0
    description: >
      After resolving symlinks, lichtbild exits with an error when the data
      directory lies inside a source root, a source root lies inside the
      data directory, or two roots overlap.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001

  # --- Scan ---
  - id: REQ-SCAN-001
    type: requirement
    title: The scan opens source files read-only and changes nothing in a root
    status: implemented
    release: v0.1.0
    description: >
      All access to source roots goes through one module that only lists
      directories, reads metadata and opens files for reading. A test builds
      a synthetic tree, records listing, size, mode, mtime and sha256 of
      every entry, runs a full scan and thumbnail pass, and requires the
      record to be identical afterwards. The test also runs with the tree
      made read-only.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001

  - id: REQ-SCAN-002
    type: requirement
    title: The scan reports found, indexed and skipped files that reconcile
    status: implemented
    release: v0.1.0
    description: >
      `lichtbild scan` prints, per root and in total, files found, indexed
      and skipped, and the skipped ones by reason (unsupported type,
      unreadable, decode error, over size limit, symlink outside root,
      hidden or system file). It writes the same report as JSON. It exits
      non-zero when found differs from indexed plus skipped. The report
      names counts and extensions, never file paths, so it can be shared.
      Indexed items without a thumbnail are counted by reason and format.
      The operator's list of every skipped file and missing thumbnail, with
      paths, is written to scan-problems.tsv in the data directory only.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-002

  - id: REQ-SCAN-003
    type: requirement
    title: Scans are idempotent and resume after interruption
    status: implemented
    release: v0.1.0
    description: >
      A file is identified by root and root-relative path; change is detected
      by size and modification time, then content hash. A second scan of an
      unchanged tree makes no index change. A scan killed part-way and run
      again yields the same index as one full run. Files that disappeared are
      marked missing.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003

  - id: REQ-SCAN-004
    type: requirement
    title: Indexing runs with bounded workers at low priority
    status: implemented
    release: v0.1.0
    description: >
      The scan uses a configured worker count (default 2) and lowers its own
      CPU and I/O priority at start. Decoders get a pixel limit and a file
      size limit; files over them are skipped with a reason.
    fields:
      priority: must
      category: non-functional
    links:
      - type: constraint-satisfies
        target: SC-005

  - id: REQ-SCAN-005
    type: requirement
    title: Symlinks that leave their root are skipped and reported
    status: implemented
    release: v0.1.0
    description: >
      The scan does not follow a symlink whose target resolves outside its
      root; it counts it as skipped with reason "symlink outside root".
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-004

  - id: REQ-SCAN-006
    type: requirement
    title: The server can start without scanning
    status: implemented
    release: v0.11.0
    description: >
      With LICHTBILD_SCAN_AT_START=0, serve answers from what the index
      already holds and runs no scan, transcript, look or faces pass until
      the next interval (none with interval 0). Any value other than 0 or 1
      is refused at start. Default 1: scan at start as before. Lets an
      operator rehearse a new release on a copy of the index.
    fields:
      priority: should
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-005

  # --- Index and metadata ---
  - id: REQ-IDX-001
    type: requirement
    title: The index is one redb database in the data directory, owned by one process
    status: implemented
    release: v0.1.0
    description: >
      Items, their source, capture date, position and derived-file state are
      stored in redb inside the data directory, with a schema version checked
      on startup. `lichtbild serve` holds the index and scans in the
      background; `lichtbild scan` refuses with a clear message while
      another process holds it.
    fields:
      priority: must
      category: functional

  - id: REQ-META-001
    type: requirement
    title: Capture date and position are stored with their source
    status: implemented
    release: v0.1.0
    description: >
      Capture date is taken from EXIF DateTimeOriginal with its offset, then
      other EXIF dates, then a date in the file name, then the file time,
      and the index records which one was used. Position is taken from EXIF
      GPS only when a fix is present; otherwise it is null. The timeline
      marks items whose date did not come from EXIF.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-004

  # --- Thumbnails ---
  - id: REQ-THUMB-001
    type: requirement
    title: Thumbnails are written atomically into a bounded cache in the data directory
    status: implemented
    release: v0.1.0
    description: >
      Thumbnails are generated in the data directory, written to a temporary
      name and renamed into place, keyed by content hash, honour the EXIF
      orientation, and the cache has a configured size cap. A thumbnail that
      cannot be generated is recorded with its reason and counted in the
      report.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003
      - type: constraint-satisfies
        target: SC-005

  # --- Web ---
  - id: REQ-WEB-001
    type: requirement
    title: A server-rendered timeline grouped by year, month and day
    status: implemented
    release: v0.1.0
    description: >
      `lichtbild serve` renders a timeline page per person and, when asked,
      merged, newest first, grouped by year, month and day, loading further
      days with htmx through keyset pagination so that tens of thousands of
      items scroll without loading all at once. Static assets are embedded.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-002
    type: requirement
    title: The app works under a configurable base path
    status: implemented
    release: v0.1.0
    description: >
      All links, assets and htmx requests are prefixed with LICHTBILD_BASE_PATH
      so the app can sit behind the house reverse proxy under a path, as haus
      does with HAUS_BASE_PATH.
    fields:
      priority: must
      category: interface

  - id: REQ-WEB-003
    type: requirement
    title: Pages load nothing from another host
    status: implemented
    release: v0.1.0
    description: >
      Every HTML response carries a Content-Security-Policy whose sources are
      'self' only, and pages use no inline style or script. A test renders
      each page and embedded asset and fails on any absolute http(s) URL to
      another host. The one exception is the operator's nav file,
      whose entries may link to other house apps: they are rendered only as
      links a person follows, never as resources the page loads.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-003

  - id: REQ-WEB-004
    type: requirement
    title: Files are served by item id only
    status: implemented
    release: v0.1.0
    description: >
      Thumbnail and original routes take an item id, look up the stored
      root-relative path, resolve it and refuse it unless it lies inside its
      root. No route accepts a path.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-004

  - id: REQ-WEB-005
    type: requirement
    title: Requests are answered only for localhost and configured host names
    status: implemented
    release: v0.1.0
    description: >
      Until login exists, a request whose Host (or authority) is not
      localhost, 127.0.0.1, ::1 or a name in LICHTBILD_ALLOWED_HOSTS gets 421
      and no library data, so a page on another site cannot read lichtbild
      through DNS rebinding.
    fields:
      priority: must
      category: constraint
    links:
      - type: satisfies
        target: SSC-001

  - id: REQ-WEB-006
    type: requirement
    title: Jump to any year or month of a timeline
    status: implemented
    release: v0.2.0
    description: >
      Every timeline page offers a date scrubber: on wide screens a rail along
      the right edge with one tick per month that has items, sized by the
      number of items and labelled on hover; on phones a "Jump to date" menu
      of years and months. Choosing a year or month starts the timeline
      there, with a link back to newer photos. Both work as plain links.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-007
    type: requirement
    title: A photo viewer that steps to the previous and next photo
    status: implemented
    release: v0.2.0
    description: >
      Choosing a photo opens it large. Previous (newer) and next (older)
      follow the order of the timeline it was opened from, by link, arrow
      key or horizontal swipe; Escape and the back link return to the
      timeline at that photo. A photo is shown only in a timeline it belongs
      to.
    fields:
      priority: must
      category: functional

  - id: REQ-WEB-008
    type: requirement
    title: The viewer shows a photo's details on request
    status: implemented
    release: v0.1.3
    description: >
      An info panel in the viewer, opened by a button or the i key and
      working without JavaScript, shows when the photo was taken and where
      that date came from, where it was taken, the camera, lens and exposure
      read from the original's EXIF, the size, file name and library.
    fields:
      priority: should
      category: functional

  - id: REQ-PLACE-002
    type: requirement
    title: Pictures without a recorded position are placed, as estimates or by hand
    status: implemented
    release: v0.6.1
    description: >
      A picture whose file records no position takes one from the pictures
      of the same library taken shortly before and after it, and is shown
      as estimated, with how far off it may be, on the map, in the viewer
      and in search. The owner of a library can set a picture's position
      on the map by hand, which then places its neighbours in time too,
      and can forget it again. A position never comes from another
      library, estimates never place other pictures, a recorded position
      always wins, and nothing is written to the source files.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002
      - type: satisfies
        target: SC-001

  - id: REQ-TEXT-001
    type: requirement
    title: Text in pictures is read in the house, searched and shown where it is
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19. lichtbild reads the text in photos (signs,
      letters, receipts, menus) in German and other Latin-script languages,
      umlauts and ß included, without sending anything out of the house. It
      keeps each line with its place on the picture, groups lines into
      blocks and blocks into separate documents (one photo can hold
      several), and drops what textures make look like text. Search finds
      pictures by their text and shows the matching lines; the viewer
      lists the text by document to read and copy, and marks each line on
      the picture, the matching ones first; a line searches for itself.
      Reading runs in a separate, limited process after the scan, each
      picture once per model, and the model files are pinned by hash.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SC-001

  - id: REQ-SEE-001
    type: requirement
    title: Things in pictures are found, searched by name and shown where they are
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19. lichtbild finds the common kinds of thing in
      photos (people, animals, vehicles, food, furniture and more), in the
      house, with their place on the picture, keeping only confident
      finds. Search knows them by their German and English names; the
      viewer lists them, each a search, and marks them on the picture.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003

  - id: REQ-SEE-002
    type: requirement
    title: Pictures are found by what they show, and by what they look like
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19 (usability beyond the big photo apps). A
      search in plain words, German or English ("zwei Katzen auf dem
      Sofa"), also finds the pictures that show it, after the exact hits,
      and only those that match well. The viewer shows the pictures that
      look like the one shown. Pictures and words are compared in the
      house; nothing leaves it. Only the viewer's libraries count.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-009
    type: requirement
    title: A status page says what the server is doing
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19: the scan's state should be visible. A status
      page shows whether a scan or the transcription pass runs now (with
      its progress), when the last scan ended, how long it took and what it
      found, how many videos have a transcript, the duplicate groups, the
      search documents, whether a map file and place names are configured,
      and the version and uptime. It refreshes itself and shows counts and
      times only, never paths, file names or error text; transcript counts
      cover the viewer's libraries, and totals over all libraries are shown
      only to someone who may see all of them. Owner report 2026-11-20
      (v0.9.0): the work is shown as four steps in order (scan,
      transcripts, looking at photos, faces), each done, running, waiting
      or off, with its totals, this pass's progress and the time left; the
      People page says when faces are still waiting for the look pass.
    fields:
      priority: should
      category: functional

  - id: REQ-WEB-010
    type: requirement
    title: Timelines, search and the map can show only photos or only videos
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. An All / Photos / Videos switch on the
      timelines, the search results and the map. The choice stays when the
      timeline loads more, when the date chooser jumps and when the map
      changes library.
    fields:
      priority: should
      category: functional

  - id: REQ-WEB-011
    type: requirement
    title: One menu reaches every page, and the home page shows the libraries
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. Every signed-in page carries the same menu
      button beside the name, listing home, map, words, hidden, duplicate
      files, status and sign-out, so no page is a dead end. The home page
      shows a card per library (and one for everyone) with its newest
      pictures, count and years, the pictures taken on this day in earlier
      years, and tiles for the map, words and status.
    fields:
      priority: should
      category: functional

  - id: REQ-WORDS-001
    type: requirement
    title: The words said in videos, as a cloud that searches
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19. A page shows the words most of the viewer's
      videos share, read from their transcripts, sized by how many videos
      say them, without common German and English words; a word opens the
      search for it. Only libraries the viewer may see count.
    fields:
      priority: could
      category: functional

  - id: REQ-PLACE-001
    type: requirement
    title: Positions are named offline, never by an outside service
    status: implemented
    release: v0.1.3
    description: >
      When the deployment supplies GeoNames files (towns with 1,000 or more
      inhabitants, optional region and country names), the info panel names
      the nearest town within about two degrees, with its distance, from an
      index lichtbild holds in memory. No position is sent to any other host.
      Without the files only coordinates are shown.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-003

  # --- Later steps (seeded, not in v0.1.0) ---
  - id: REQ-AUTH-001
    type: requirement
    title: Login through the house OIDC provider, deny by default
    status: implemented
    release: v0.2.0
    description: >
      With an OIDC issuer configured, every route except the health check,
      the embedded static assets and the login routes needs a session from
      the authorization code flow with PKCE; anything else is redirected to
      the provider (htmx requests get 401 with HX-Redirect). The ID token's
      signature, issuer, audience, expiry and nonce are verified; a callback
      for an unknown or used state is refused; an identity that is not one
      of the configured people gets 403 and no session. Session cookies are
      random, HttpOnly, SameSite=Lax, and Secure behind https. Without an
      issuer configured, serve stays on loopback only.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-001

  - id: REQ-AUTH-002
    type: requirement
    title: Each person sees their own library; other libraries and the merged view only by grant
    status: implemented
    release: v0.2.0
    description: >
      People map to source roots by OIDC subject or verified email. A person
      sees their own library and those listed in their `sees` grant (owner
      decision 2026-11-17: own only by default). Timelines, the viewer,
      thumbnails, previews and originals are all checked against the viewer;
      the merged view exists only for a person who may see more than one
      library.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-NAV-001
    type: requirement
    title: Render the shared nav v1 app switcher
    status: implemented
    release: v0.2.0
    description: >
      With LICHTBILD_NAV (the nav v1 file) and LICHTBILD_NAV_SELF (this app's
      id) set, every page's header shows the home link and the app switcher,
      this app marked as current, exactly as haus and warte render it
      (contract: warte docs nav, since warte v1.6.25). Both settings or
      neither; a file that breaks the contract stops startup naming the field.
    fields:
      priority: should
      category: interface

  - id: REQ-NAV-002
    type: requirement
    title: The house's apps open from one menu at the top right
    status: implemented
    release: v0.10.0
    description: >
      Owner request 2026-11-21: instead of a row of links, the nav v1 apps
      open from one button at the top right (four dots) as a panel like
      lichtbild's own menu: home first, then every app with a mark, its
      name and its description, this app marked as current. The nav file
      and its contract are unchanged (the same 1 + apps links); a tap
      outside or Escape closes the panel, and it scrolls when taller than
      the screen, as the app menu does. The owner made this the nav
      contract's rendering for every house app (2026-11-21, through warte,
      the contract's owner), and nav v2 adds an optional mark per app (1 to
      8 code points; the first letter of the name otherwise). lichtbild
      accepts version 1 and 2; a mark in a version 1 file is refused.
    fields:
      priority: should
      category: interface

  - id: REQ-MAP-003
    type: requirement
    title: The countries one's pictures were taken in
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: mark the countries visited. The Countries
      page lists every country the viewer's pictures were taken in, by
      the offline place names' nearest town to each position (recorded,
      set by hand or estimated), with its flag, how many pictures, on how
      many days and in which years, most pictures first, counted as the
      timeline shows them (one copy each, nothing hidden, only the
      viewer's libraries). A country opens the map on its pictures alone;
      a malformed country code is refused. Without place names the page
      says so. The map shades the countries of what the viewer sees, from
      Natural Earth's public-domain outlines (owner's approval 2026-11-21),
      pinned by sha256 and served by lichtbild.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-MAP-002
    type: requirement
    title: The map narrows to a trip or a time range
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: select the trips on the map, and a time
      slider for a rough range. The map offers the viewer's trips (as the
      Trips page finds them) and a slider over the months that have a
      position; a trip opens the map on its pictures alone, the slider
      narrows the clusters in place. The clusters and the page's count
      hold only pictures of those days, scoped as before; a malformed or
      backward range is refused.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-MAP-001
    type: requirement
    title: World map from a local PMTiles file, served by lichtbild
    status: implemented
    description: >
      Photos and videos with a position are shown on a map at /map,
      clustered by zoom on the server and scoped to the viewer exactly like
      the timeline: a person never sees, counts or locates an item of a
      library they may not see. Tiles come from one Protomaps PMTiles file
      the deployment provides (LICHTBILD_MAP_PMTILES), served by lichtbild
      with byte ranges; glyphs and sprites from a deployment directory
      (LICHTBILD_MAP_ASSETS) whose requests are confined to it. MapLibre,
      pmtiles and the Protomaps style are vendored at pinned versions and
      sha256 and served by lichtbild, so the browser makes no request to
      another host and the CSP stays 'self' only. Without a PMTiles file the
      page says so; without the assets directory the map has no labels.
      The map shows "© OpenStreetMap" and works under the base path.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-003
      - type: satisfies
        target: SSC-002
      - type: satisfies
        target: SSC-004

  - id: REQ-MEDIA-001
    type: requirement
    title: MP4 and MOV video with poster frames, length and streaming
    status: implemented
    release: v0.3.0
    description: >
      MP4, M4V, 3GP and MOV videos are indexed with their length, codec,
      capture date (Apple keys with offset, else the container's UTC time)
      and position (Apple keys or ©xyz). H.264 and HEVC (8 and 10 bit) get a
      poster from their first keyframe, rotated as the track says; other
      codecs are indexed without one and counted by codec. Only the moov
      index and one keyframe are read, both capped; the decoders run in a
      separate process under a timeout and CPU and memory limits. The
      viewer plays the original, which is served with byte ranges.
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-MEDIA-003
    type: requirement
    title: Motion Photos play their embedded clip
    status: draft
    description: >
      Pixel and Samsung Motion Photos (a JPEG with an MP4 appended) and
      Apple Live Photos (a HEIC next to a MOV of the same name) show their
      clip in the viewer. Split from the video requirement at v0.3.0.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-MEDIA-002
    type: requirement
    title: HEIC photos are indexed and shown, decoded in memory-safe code
    status: implemented
    release: v0.1.3
    description: >
      HEIC and HEIF stills (single images and tile grids, with rotation and
      mirror applied) are indexed like JPEGs: dimensions, EXIF date and
      position, a thumbnail, and a JPEG preview of at most 2048 px that the
      viewer shows, because most browsers cannot display HEIC. Decoding is
      pure Rust without unsafe code, under the pixel limit; a file it cannot
      decode is skipped as "decode error (heic)".
    fields:
      priority: must
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-FACE-001
    type: requirement
    title: Face and similarity models run locally and are pinned by sha256
    status: implemented
    release: v0.8.0
    description: >
      Model files come from the deployment, are checked against a pinned
      sha256 before loading and run in the house (the face models in a
      child process per photo); nothing is downloaded at run time. Without
      the face models there are no faces and nothing else changes; one of
      them missing or unknown is an error.
    fields:
      priority: could
      category: constraint
    links:
      - type: satisfies
        target: SSC-007

  - id: REQ-FACE-002
    type: requirement
    title: Faces in photos are found and one person's faces are grouped
    status: implemented
    release: v0.8.0
    description: >
      Owner request 2026-11-20 (next after v0.7.0). Every photo is looked
      at for faces once, after the look pass, in a separate process where a
      picture that breaks or hangs fails alone; each face keeps its place in
      the photo, a vector and a small picture. Faces of one person, in all
      libraries, are grouped; a group of someone seen in at least two
      photos is offered for a name on a People page, biggest first.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-007
      - type: satisfies
        target: SSC-003

  - id: REQ-FACE-003
    type: requirement
    title: Names of people are the household's, seen only through one's own photos
    status: implemented
    release: v0.8.0
    description: >
      Owner decision 2026-11-20: a name given to a face is the same for
      everyone in the house. Naming a group names its faces the viewer
      sees, and the name passes to that person's other faces; "not them"
      on a face takes the name off and keeps it off. A person, their
      page, their photos, their faces, their name in suggestions and the
      search by their name exist for a viewer only through photos the
      viewer may see and did not hide; a name field offers only those
      names, and a name typed is matched only among them (a name only
      someone else has photos of becomes a person of its own), so naming
      tells nothing about anyone else's photos. Naming, renaming (the name
      of someone the viewer knows puts both together), taking a name off
      and "not them" need a same-site request on a face or person the
      viewer may see.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-FACE-004
    type: requirement
    title: Named people have relations, and the close ones come first
    status: implemented
    release: v0.10.0
    description: >
      Owner request 2026-11-21: a person page says how this person stands
      to another named person (partner, parent or child, sibling,
      grandparent or grandchild, aunt or uncle and niece or nephew, cousin,
      in-law, godparent or godchild, family, friend, former partner,
      schoolmate, teacher or student, colleague, teammate, neighbour,
      acquaintance) and how much it matters
      (close, normal, loose; by default from the kind). Relations read
      from both sides (parent of / child of), are listed close ones
      first, link to the photos of both together, and order the People
      page (closest first, then by photos). Like names they are the
      household's, seen and changed only between people the viewer
      knows (as with names), with a same-site request; a relation never
      creates a name, refuses oneself, and goes with a name taken off or
      merged into another.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-FACE-005
    type: requirement
    title: Strangers' faces and people can be hidden, and shown again
    status: implemented
    release: v0.10.0
    description: >
      Owner request 2026-11-21: faces of no one the house knows (people in
      a museum) are hidden from "Who is this?" or from a photo's faces in
      one step; they become one nameless hidden person, so the same face
      in other photos is put away too. A named person can be hidden as
      well. A hidden person is not on the People page (only in its
      "Hidden" list, from which they are shown again), not in a photo's
      faces, name suggestions, search by name or relations; the photos
      stay. Hiding is for everyone in the house, needs a same-site
      request, and only someone who sees the person may hide them.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-STORY-001
    type: requirement
    title: A made-up story of some days, from what the pictures show
    status: implemented
    release: v0.10.0
    description: >
      Owner request 2026-11-21: "some kind of funny story mode" from the
      photos and their text, "with some fantasy" and templates. From a
      run of days (a day or a trip), lichtbild tells a short fairy-tale
      story in German (or English), picture by picture: the town, the
      people named in them, the things seen, a sign's words, words said
      in a video. It uses only pictures the viewer sees there, names only
      people who are not hidden, is marked as made up, tells the same
      story for the same seed and another for another, and stays short
      (at most 12 pictures, spread over the days).
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-STORY-002
    type: requirement
    title: The same days as a poem, rhymed, with a haiku
    status: implemented
    release: v0.10.0
    description: >
      Owner request 2026-11-21 ("via haiku as rhyme"): a story can be told
      as a poem instead, a haiku of 5, 7 and 5 syllables for the whole,
      then rhymed couplets picture by picture with the same facts as the
      story (town, people, things, a sign's words, words said). The rhyme
      words are fixed in the templates, so every couplet rhymes; a haiku
      line takes a fact only when its syllables make the count.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-027
    type: requirement
    title: Slideshows and videos on the TV through AirPlay
    status: implemented
    release: v0.10.0
    description: >
      Owner decision 2026-11-20: the TV is reached by AirPlay only (no
      Google Cast; the page stays same-origin). A web page cannot send
      pictures to AirPlay, so on Apple devices the slideshow has a TV
      button that says how to mirror the screen (Control Centre, Screen
      Mirroring, the Apple TV) and makes the slideshow fill it; a video in
      the viewer offers AirPlay itself (x-webkit-airplay).
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-MEDIA-004
    type: requirement
    title: Speech in videos is transcribed in the house, with times
    status: implemented
    release: v0.4.0
    description: >
      After each scan, videos without a transcript from the configured
      Whisper model are transcribed one at a time, in a separate process
      under a timeout and CPU and memory limits, until the next scan is due.
      Transcripts carry a time and language per line, are stored per content
      hash, and are shown in the viewer, where a time seeks the video. The
      model files are pinned by SHA-256 and checked at startup. No audio,
      text or request leaves the house. Silence, tones and music give no
      text rather than invented text.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-005

  - id: REQ-SEARCH-001
    type: requirement
    title: One search box over what was said, places, dates and names
    status: implemented
    release: v0.4.0
    description: >
      A search box in every page's header finds items by words spoken in
      their videos, the nearest town, the year and month (German and
      English), and file and folder names. A spoken hit links to its moment
      in the video. Results come only from the libraries the viewer may
      see, enforced in the query.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-SEARCH-002
    type: requirement
    title: The search box suggests what the libraries hold as it is typed
    status: implemented
    release: v0.7.0
    description: >
      While a word is typed into the search box, a list under it offers
      completions of the last word: things found in pictures (German, found
      by their English name too), places, years and months, and words said
      in videos or written in pictures, each with how many items hold it.
      Earlier words of the query are kept, and a completion that would find
      nothing together with them is not offered. Only terms that items in the
      libraries the viewer may see hold are offered; common words and a
      single letter offer nothing. The results page keeps the query in the
      box so it can be refined.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-012
    type: requirement
    title: Photos taken one after another that look alike show as one series
    status: implemented
    release: v0.7.0
    description: >
      In the timeline, photos of one day, each taken at most two minutes
      after the one before and looking alike by their picture vectors
      (cosine at least 0.92), show as one tile with a count: a burst, or
      the same scene taken again. The count opens the rest of the series in
      place and closes it again; the tile still opens the viewer, whose
      arrows pass through every photo. Without picture vectors nothing is
      grouped.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-013
    type: requirement
    title: A slideshow from any photo on
    status: implemented
    release: v0.7.0
    description: >
      The viewer starts a slideshow from the photo shown (button or key s):
      the timeline's photos from there on, older and older, one every five
      seconds, cross-faded and loaded ahead, full screen where the browser
      allows it. It shows one photo of each series, no videos, and nothing
      the viewer hid or may not see. A tap or the space bar pauses, arrows
      and swipes step, Escape closes to the viewer at the photo last shown;
      the screen stays on while it plays where the browser allows it.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-SEARCH-003
    type: requirement
    title: Search results offer terms that narrow them down
    status: implemented
    release: v0.7.0
    description: >
      Above four or more results, the results page offers the things found
      in them, their places and their years that some but not all results
      hold, with how many hold each: up to four things, three places and
      four years, the most held first. Each is a link to the query with the
      term added, keeping the photo/video filter and the library searched;
      terms already in the query, and terms that would find nothing with
      it, are not offered, and each count is what the link finds.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-014
    type: requirement
    title: Several items are chosen in the timeline and hidden at once
    status: implemented
    release: v0.7.0
    description: >
      "Select" in the timeline turns taps on tiles into choosing them; a
      closed series counts whole. "Hide for me" hides the chosen items for
      this person only, with an undo that shows them again. Only items the
      person may see change, and only on a request from the same site.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-SEARCH-004
    type: requirement
    title: Pictures are found by season and holiday
    status: implemented
    release: v0.7.0
    description: >
      Besides year, month and day, search knows each item's season
      (Frühling/spring March to May, Sommer/summer June to August,
      Herbst/autumn September to November, Winter December to February) and
      holiday (Weihnachten/Christmas 24 to 26 December, Silvester and
      Neujahr, Ostern/Easter from Good Friday to Easter Monday), in German
      and English; the search box suggests them with their year.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-TRIP-001
    type: requirement
    title: Trips are found from where pictures were taken
    status: implemented
    release: v0.7.0
    description: >
      A Trips page lists the times away from home, newest first: days whose
      pictures (by their recorded, hand-set or estimated positions) were
      taken more than 50 km from home, at most two days apart, with no day
      at home between, holding at least three items. Home is the place with
      the most days of pictures. Each trip shows its places (most days
      first), its days, how many items it holds and a photo, and opens the
      timeline at its last day. Only items the viewer may see and has not
      hidden count; nothing leaves the house.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-015
    type: requirement
    title: Keys and gestures are listed one tap away
    status: implemented
    release: v0.7.0
    description: >
      Every page's menu has "Keys and gestures", and "?" outside a text
      field opens the same list: the viewer's, the slideshow's, the search
      box's and the timeline's keys and gestures, in a dialog closed by
      Escape, a tap outside or its button. The automated check covers the
      menu entry on every page; the dialog itself runs in the browser.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-016
    type: requirement
    title: Each person keeps their own favourites
    status: implemented
    release: v0.7.0
    description: >
      A person marks a picture as a favourite with the heart in the viewer
      (or "."), or several at once from a timeline selection, and takes
      the mark off the same ways. Only items they may see can be marked,
      only by a same-site request. Favourites are per person: another
      person who sees the same library never sees them. The timeline shows
      a heart on each favourite; a Favourites page lists them newest first
      (not the hidden ones) with a slideshow of them alone. In search,
      "♥" or "Favoriten" next to other words keeps only favourites, alone
      it opens the Favourites page, and a partly typed "Fav" is suggested
      to whoever has favourites. Nothing in the libraries changes.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-026
    type: requirement
    title: A slideshow of the chosen pictures
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: a slideshow of the pictures selected. The
      selection bar of a timeline offers a slideshow of the chosen
      pictures: only those, only photos, only of that timeline's
      libraries and not hidden; anything else in the list is left out.
      On a TV it plays through the device's own screen mirroring
      (AirPlay); casting to other receivers would need a script from
      another host, which the same-origin rule does not allow.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-025
    type: requirement
    title: How quickly the server answers is measured and shown
    status: implemented
    release: v0.9.0
    description: >
      Owner report 2026-11-20: the system sometimes feels unresponsive, and
      there should be a measure (KPI) of it. Every answer is timed by its
      route (the template, never ids or the query), kept for the last hour
      in memory, sent back as Server-Timing, and an answer slower than a
      second is logged by route. The status page shows, for pages and for
      pictures, how many answers, the median and the 95th percentile, and
      the slowest routes over a second. The status page's own counts,
      which read every item, are kept for a minute so an open status page
      does not keep the index busy.
    fields:
      priority: should
      category: non-functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-024
    type: requirement
    title: Day or night is the person's choice
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: a day and a night view. The menu switches
      between auto (the device's setting), day and night; the choice is
      kept in the browser and applied before the page is drawn, the map
      follows it, and nothing is sent to the server.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-023
    type: requirement
    title: Every panel over the photo can lie below it, and corrections save in place
    status: implemented
    release: v0.9.0
    description: >
      Owner report 2026-11-20: everything overlapping the photo should be
      possible to move down; and changing several corrections lost what
      was typed in the other rows. Each panel the viewer opens over the
      photo (transcript, text, things, people, info) offers to lie below
      the photo instead, all together, kept in the browser. A correction
      is sent in the background and only its own row (or, for a kind
      never in the house, its list) is replaced, so the other rows keep
      what was typed and the panel stays open; without JavaScript the
      forms post as before.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-022
    type: requirement
    title: A video plays with its transcript as captions
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: while a video plays, see what is said
      without scrolling down to the transcript. A video with a transcript
      carries it as a captions track (WebVTT, the transcript's times and
      text, in its language), shown by default and turned off with the
      player's own control, also in full screen and on a TV. The captions
      are served only to whoever may see the video; a photo or an unknown
      item has none.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-021
    type: requirement
    title: The best shot leads its series
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: similar photos grouped, ideally selecting
      the best shot. In the timeline and on a day's page a series of
      look-alike shots is led by the viewer's favourite among them, else
      by the sharpest, well-exposed one; the rest follow in their order.
      Opened, the series offers to keep the best and hide the others for
      this person only, and to show them again.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-020
    type: requirement
    title: The hidden list sorts, narrows and shows several again
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: in the hidden view, select several and sort
      by name or date or a word. The hidden list orders newest first,
      oldest first or by file name, keeps only items whose file name or
      date holds a word, and shows the chosen ones again at once, back to
      the same order and word. File names come only from the viewer's own
      library; an item of a granted library shows its date alone, and its
      name does not find it.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-019
    type: requirement
    title: From a day to the days before and after, or any day
    status: implemented
    release: v0.9.0
    description: >
      Owner request 2026-11-20: on the day view, choose any day and browse
      forwards and backwards. A day (or a trip's days) links to the
      nearest earlier and later day with a picture the viewer would see
      there (one copy each, nothing hidden, only their libraries), and a
      date picker opens any day; ← and → step a day. A malformed date is
      refused.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-018
    type: requirement
    title: A trip, a day, or this day in every year is shown alone
    status: implemented
    release: v0.8.0
    description: >
      Owner report 2026-11-20: a trip opened the timeline without marking
      it, and a day could not be shown by itself. A trip, a day heading of
      the timeline, the date of a photo in the viewer and "On this day" on
      the home page each open just those pictures (one copy each, nothing
      hidden, only the viewer's libraries), newest first, with a heading
      and a slideshow of them. Nonsense dates are refused.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-WEB-017
    type: requirement
    title: Each person keeps their own albums
    status: implemented
    release: v0.7.0
    description: >
      A person makes named albums (from the Albums page, or a new one named
      while adding), puts pictures in from a timeline selection or a
      photo's details, takes them out, renames and deletes albums; deleting
      an album leaves its pictures. Only items the viewer may see go in,
      only by a same-site request. Albums are per person: anyone else,
      even someone who sees the same library, finds no such album and
      cannot change it. The owner may share an album with the household
      (off until turned on, and turned off again the same way): then
      everyone signed in finds it under "Shared with you" with its owner
      named and opens it, but only the owner adds to, takes from,
      renames, shares or deletes it. An album page shows its pictures the
      viewer may see, newest first, without the ones the viewer hid, with
      a slideshow of the album alone.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-001
    type: requirement
    title: The same picture is shown once, as its best copy
    status: implemented
    release: v0.5.0
    description: >
      Exact copies (same content) and the same picture in another file (a
      messenger copy without its camera date, a resized export, the JPEG
      twin of a HEIC) are grouped. Timeline, search and map show one copy
      of each group: the best one the viewer may see (camera date, position,
      pixels, file size), with the number of copies; the viewer lists them.
      Shots of a burst are not grouped. Nothing in the libraries changes.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-002
    type: requirement
    title: Each person can hide what they do not want to see
    status: implemented
    release: v0.5.0
    description: >
      In the viewer a person can hide an item, or keep one copy of a
      duplicate group and hide the others. Hidden items leave that person's
      timeline, search and map; a "Hidden" page shows them again. One
      person's choice never changes another's view, an item in a library
      the person may not see cannot be hidden, another site's form cannot
      hide anything, and nothing in the libraries changes.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-DUP-003
    type: requirement
    title: A list of duplicate files to clean up, for one's own library
    status: implemented
    release: v0.5.0
    description: >
      A page and a CSV list exact duplicate files (same content) in the
      libraries a person owns, with the copy to keep and the space the
      others take. Only one's own library's paths are listed, never those
      of a library one was granted. lichtbild deletes nothing.
    fields:
      priority: could
      category: functional
    links:
      - type: satisfies
        target: SSC-002


  - id: REQ-FIX-001
    type: requirement
    title: The house corrects the things found, and the correction stays
    status: implemented
    release: v0.8.0
    description: >
      Owner request 2026-11-20 ("we have a snowboard which we don't
      have"): in the viewer, each thing found can be marked right, not
      there, or another kind, and a kind can be marked never in the house.
      Corrections are the household's (owner's decision): they hold for
      everyone, in the viewer, on the Things page, in search and its
      suggestions, and are kept apart from what the model found, so the
      next look pass keeps them (matched by kind and box). From two wrong
      finds of a kind on, a find of that kind needs a higher score than
      the surest of them, never above a find of it marked right. A
      Corrections page lists them, and a download holds them as one JSON
      object per line (photo by content hash, box, what the model said,
      what is right; no pictures, not who said it) to teach a model one
      day. Correcting needs a same-site request on a photo the viewer may
      see; the page and the download show only photos the viewer may see
      and did not hide.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-FIX-002
    type: requirement
    title: The house corrects the text read in a photo
    status: implemented
    release: v0.8.0
    description: >
      Each line read in a photo can be corrected or taken out, for the
      whole house; the viewer and search use the corrected text, the
      viewer says what was first read, and the next reading keeps the
      correction (matched by the line's box or its text). It is listed on
      the Corrections page and in the download like things, under the
      same checks.
    fields:
      priority: should
      category: functional
    links:
      - type: satisfies
        target: SSC-002

  - id: REQ-FIX-003
    type: requirement
    title: A thing the detector does not know gets the house's own word
    status: implemented
    release: v0.11.0
    description: >
      Owner report 2026-11-21 on 0.9.0: a capybara found as a bear could
      not be changed to "Capybara", and the row only turned red. "It is
      a..." takes any word with a letter and at most 40 characters: a
      kind the detector knows stays that kind; any other word becomes
      the house's own kind (up to 128), the same word in other letters
      being the same kind. Own words are shown on the find, its box, the
      counts and the Things page, are searched and suggested, and are
      offered in "It is a..." again, only to viewers who see a library
      the word was used in. When all own kinds are taken, one no
      correction uses any more is given to the new word. A word refused
      is refused with the
      reason, shown in the row. Own words cannot be marked "never in our
      house" (that mark is for the detector's kinds) and are not used in
      stories yet.
