artifacts:
  # Verification activities: each test names the requirements it checks.
  # docs/planted-faults.md lists the fault that shows each one can fail.

  - id: VER-001
    type: verification
    title: rivet validate in CI from the pinned layer
    status: draft
    fields:
      method: automated-test
      test-name: "rivet validate"
      test-location: .github/workflows/ci.yml
    links:
      - type: verifies
        target: REQ-TRACE-001

  - id: VER-002
    type: verification
    title: Planted-fault harness
    status: draft
    fields:
      method: automated-test
      test-name: "scripts/planted_faults.py"
      test-location: scripts/planted_faults.py
    links:
      - type: verifies
        target: REQ-FAULT-001

  - id: VER-003
    type: verification
    title: hostname-scan on every pull request, merge group and push
    status: draft
    fields:
