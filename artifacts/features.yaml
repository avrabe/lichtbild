artifacts:
  - id: FEAT-001
    type: feature
    title: Skeleton - read-only scan, redb index, thumbnails, timeline
    status: implemented
    release: v0.1.0
    description: >
      Step 2 of docs/BRIEF.md. `lichtbild scan` walks each root read-only,
      indexes JPEG, PNG, WebP and GIF with capture date and position and
      their source, writes thumbnails atomically into a bounded cache, and
      reports found, indexed and skipped per root so they reconcile.
      `lichtbild serve` renders the timeline per person or merged under a
      base path, with a same-origin CSP.
    fields:
      phase: phase-1
      acceptance-criteria:
        - cargo test passes, and scripts/planted_faults.py reports every fault caught
        - A scan of a synthetic tree leaves it byte-identical, also when read-only
        - The scan report reconciles found = indexed + skipped per root
    links:
      - type: satisfies
        target: REQ-FAULT-001
      - type: satisfies
        target: REQ-PRIV-001
      - type: satisfies
        target: REQ-CFG-002
      - type: satisfies
        target: REQ-SCAN-002
      - type: satisfies
        target: REQ-SCAN-003
      - type: satisfies
        target: REQ-SCAN-004
      - type: satisfies
        target: REQ-SCAN-005
      - type: satisfies
        target: REQ-SCAN-006
      - type: satisfies
        target: REQ-META-001
      - type: satisfies
        target: REQ-THUMB-001
      - type: satisfies
        target: REQ-WEB-001
      - type: satisfies
        target: REQ-WEB-004
      - type: satisfies
        target: REQ-WEB-005

  - id: FEAT-002
    type: feature
    title: Timeline navigation - date scrubber and photo viewer
    status: implemented
    release: v0.2.0
    description: >
      Owner request 2026-11-14 after using v0.1.1: jump to a year or month
      instead of scrolling, and step through photos with swipes or arrow
      keys. The home page also shows the merged view's count.
    fields:
      phase: phase-1
      acceptance-criteria:
        - From any month in the rail or menu the timeline starts at that month
        - Swiping left or right in the viewer goes to the next or previous photo
    links:
      - type: satisfies
        target: REQ-WEB-006
      - type: satisfies
        target: REQ-WEB-007

  - id: FEAT-003
    type: feature
    title: HEIC photos in the timeline and viewer
    status: implemented
    release: v0.1.3
    description: >
      The 1,043 iPhone and iPad HEIC photos the first real scan reported as
      "not yet supported (heic)" appear in the timeline, with a JPEG preview
      in the viewer.
    fields:
      phase: phase-1
      acceptance-criteria:
        - The real library's scan reports "decode error (heic)" for at most 2% of HEIC files
    links:
      - type: satisfies
        target: REQ-MEDIA-002

  - id: FEAT-004
    type: feature
    title: Photo details and place names in the viewer
    status: implemented
    release: v0.1.3
    description: >
      Owner request 2026-11-14: a metadata view in the viewer, with the GPS
      position turned into a place name, offline.
    fields:
      phase: phase-1
      acceptance-criteria:
        - The info panel names the nearest town for a photo with GPS when GeoNames files are configured
    links:
      - type: satisfies
        target: REQ-WEB-008
      - type: satisfies
        target: REQ-PLACE-001

  - id: FEAT-005
    type: feature
    title: Login and per-person libraries
    status: implemented
    release: v0.2.0
    description: >
      Step 3 of the brief, moved ahead of the map by the owner: nothing is
      routed to the household before login exists.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A household member signs in with the house identity provider and sees only their own library unless granted more
    links:
      - type: satisfies
        target: REQ-AUTH-001
      - type: satisfies
        target: REQ-AUTH-002
      - type: satisfies
        target: REQ-NAV-001
      - type: satisfies
        target: REQ-NAV-002

  - id: FEAT-006
    type: feature
    title: Videos in the timeline
    status: implemented
    release: v0.3.0
    description: >
      Owner request 2026-11-18: the 790 videos the scan reported as "not yet
      supported (video)" appear in the timeline with a poster and their
      length, and play in the viewer. Transcripts follow (v0.4.0).
    fields:
      phase: phase-1
      acceptance-criteria:
        - The real library's scan reports at most 5% of H.264 and HEVC videos as "decode-error (h264)" or "decode-error (hevc)"
    links:
      - type: satisfies
        target: REQ-MEDIA-001

  - id: FEAT-007
    type: feature
    title: World map of photos and videos
    status: implemented
    description: >
      Step 3 of the brief: a map of where photos and videos were taken, with
      tiles from a self-hosted PMTiles file and nothing loaded from outside.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A signed-in person sees their own positioned items, clustered by zoom, on the deployment's PMTiles map, and opens one in the viewer by clicking it
    links:
      - type: satisfies
        target: REQ-MAP-001

  - id: FEAT-008
    type: feature
    title: Transcripts and one search box
    status: implemented
    release: v0.4.0
    description: >
      Owner request 2026-11-18: decode the audio of videos into transcripts
      that can be read and searched.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A word spoken in a household video finds it, and the hit opens the video at that moment
        - The first full pass on the Pi runs at most 2x real time on speech
    links:
      - type: satisfies
        target: REQ-MEDIA-004
      - type: satisfies
        target: REQ-SEARCH-001

  - id: FEAT-009
    type: feature
    title: Duplicates shown once
    status: implemented
    release: v0.5.0
    description: >
      Owner request 2026-11-18: detect the same pictures so they need not be
      seen several times, to hide them per person, and to get a list of
      duplicate files to clean up.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A photo in both libraries, or saved again from a messenger, appears once in the merged timeline
        - What one person hides stays visible to the other
    links:
      - type: satisfies
        target: REQ-DUP-001
      - type: satisfies
        target: REQ-DUP-002
      - type: satisfies
        target: REQ-DUP-003

  - id: FEAT-010
    type: feature
    title: Finding one's way, the server's status, and words
    status: implemented
    release: v0.6.0
    description: >
      Owner request 2026-11-19: show the scan's status, make the home page
      more appealing, replace the scattered links with one menu, a cloud of
      the words said in videos, a better map page, and a photo/video filter.
    fields:
      phase: phase-1
      acceptance-criteria:
        - From any page the menu reaches every other page
        - The status page shows a running transcription pass with its progress
        - A word in the cloud opens the videos that say it
    links:
      - type: satisfies
        target: REQ-WEB-009
      - type: satisfies
        target: REQ-WEB-010
      - type: satisfies
        target: REQ-WEB-011
      - type: satisfies
        target: REQ-WORDS-001

  - id: FEAT-011
    type: feature
    title: Placing pictures without a recorded position
    status: implemented
    release: v0.6.1
    description: >
      Roadmap (owner, 2026-11-18): place photos without GPS from their
      context, shown as estimated, never written to the sources; and let a
      person place them on the map.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A camera photo taken minutes after a phone photo appears on the map, marked as estimated
        - Placing one photo of a trip by hand places the photos taken around it
    links:
      - type: satisfies
        target: REQ-PLACE-002

  - id: FEAT-012
    type: feature
    title: Text in pictures
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19: recognize text in pictures, ideally with its
      layout and whether a picture holds one document or several, shown
      where it was found on the picture and clickable.
    fields:
      phase: phase-1
      acceptance-criteria:
        - Searching a word on a sign finds the photo and marks the line on it
        - A photo of two letters on a table lists two documents
    links:
      - type: satisfies
        target: REQ-TEXT-001

  - id: FEAT-013
    type: feature
    title: Things in pictures and search by meaning
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19: object detection together with the text
      in pictures, in one big release, more usable than the big photo
      apps.
    fields:
      phase: phase-1
      acceptance-criteria:
        - Searching "Katze" finds the photos with a cat, and the viewer marks it
        - A sentence like "zwei Katzen auf dem Sofa" finds such a photo without any words in it
        - The viewer shows pictures that look like the one shown
    links:
      - type: satisfies
        target: REQ-SEE-001
      - type: satisfies
        target: REQ-SEE-002


  - id: FEAT-014
    type: feature
    title: Usability round beyond the big photo apps
    status: implemented
    release: v0.7.0
    description: >
      Owner request 2026-11-19: work through the night on one big release;
      lichtbild should be more usable than the photo apps of the big
      vendors. Search that helps while typing comes first.
    fields:
      phase: phase-1
      acceptance-criteria:
        - Typing "kat" offers "Katze" with its count, and picking it runs the search
        - The results page keeps the query in the box
        - A burst of ten shots shows as one tile with "10", and opens in place
        - On the iPad, a slideshow runs from any photo with the screen kept on
        - Searching "Hund" offers "2021 (12)" and "Katze (3)" to narrow down
        - Twenty screenshots are chosen and hidden in one go, and the undo brings them back
        - A holiday shows on the Trips page under the town visited, with its days
        - A heart on a photo puts it among one's favourites, with its own slideshow
        - Twenty holiday photos go into a new album "Sommer" from one selection, shared with the house if wanted
    links:
      - type: satisfies
        target: REQ-SEARCH-002
      - type: satisfies
        target: REQ-WEB-012
      - type: satisfies
        target: REQ-WEB-013
      - type: satisfies
        target: REQ-SEARCH-003
      - type: satisfies
        target: REQ-WEB-014
      - type: satisfies
        target: REQ-SEARCH-004
      - type: satisfies
        target: REQ-TRIP-001
      - type: satisfies
        target: REQ-WEB-015
      - type: satisfies
        target: REQ-WEB-016
      - type: satisfies
        target: REQ-WEB-017

  - id: FEAT-015
    type: feature
    title: Faces and the people in the photos
    status: implemented
    release: v0.8.0
    description: >
      Owner request 2026-11-20, after v0.7.0: faces next. Names are the
      household's (owner's decision), seen through one's own photos. With
      the owner's report the same day: trips and days shown alone.
    fields:
      phase: phase-1
      acceptance-criteria:
        - The People page offers the face seen most often, with a field for a name
        - A name given once finds that person in hundreds of photos, and "Oma" in search opens her photos
        - "Not Oma" on a wrongly named face takes the name off for good
        - Someone who sees only their own library never learns of a person who is only in another's photos
        - A trip, a day and "On this day" open just their pictures, with a slideshow
    links:
      - type: satisfies
        target: REQ-WEB-018
      - type: satisfies
        target: REQ-FACE-001
      - type: satisfies
        target: REQ-FACE-002
      - type: satisfies
        target: REQ-FACE-003
      - type: satisfies
        target: REQ-FACE-004
      - type: satisfies
        target: REQ-FACE-005


  - id: FEAT-016
    type: feature
    title: Correct what the looking got wrong
    status: implemented
    release: v0.8.0
    description: >
      Owner request 2026-11-20: collect what is not right, fix it where it
      shows, and keep it to refine the models one day. In this release
      (owner's decision), shared in the house.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A snowboard that is not there is gone from the photo, Things and search after one tap, for everyone
        - After two wrong snowboards, other photos' unsure snowboards are left out too
        - "\"No snowboards in our house\" leaves out every snowboard, and can be taken back"
        - A misread line is corrected in place and search finds the right word
        - The corrections download teaches a model which find was wrong, with no picture in it
    links:
      - type: satisfies
        target: REQ-FIX-001
      - type: satisfies
        target: REQ-FIX-002
      - type: satisfies
        target: REQ-FIX-003

  - id: FEAT-017
    type: feature
    title: Browse, sort and choose more easily
    status: implemented
    release: v0.9.0
    description: >
      Owner requests 2026-11-20 evening, after trying v0.8.0 on the iPad:
      any day and the days around it, sorting and selecting what is
      hidden, the best shot of a series, trips and a time range on the
      map, and the countries visited.
    fields:
      phase: phase-1
      acceptance-criteria:
        - From a day, the day before and after with pictures are one tap away, and any day is one pick away
        - Hidden pictures sort by date or name, narrow by a word, and come back several at a time
        - A series shows its best shot first, and the others go away in one tap
        - The map shows one trip, or the months chosen on a slider
        - The countries visited are listed with their pictures, and each opens on the map
        - What is said in a video shows over it while it plays
        - Nothing has to cover the photo, and several corrections can be made one after another
        - Day or night by a switch in the menu
        - How quickly pages answer is a number on the status page, with the slow ones named
        - A slideshow of just the pictures chosen
    links:
      - type: satisfies
        target: REQ-WEB-026
      - type: satisfies
        target: REQ-WEB-025
      - type: satisfies
        target: REQ-WEB-024
      - type: satisfies
        target: REQ-WEB-023
      - type: satisfies
        target: REQ-WEB-022
      - type: satisfies
        target: REQ-MAP-003
      - type: satisfies
        target: REQ-MAP-002
      - type: satisfies
        target: REQ-WEB-021
      - type: satisfies
        target: REQ-WEB-019
      - type: satisfies
        target: REQ-WEB-020

  - id: FEAT-018
    type: feature
    title: People, stories and the house's apps
    status: implemented
    release: v0.10.0
    description: >
      Owner requests 2026-11-21 morning: relations between people and
      which matter, hiding strangers and people, a made-up story of some
      days, the house's apps from one menu, and the country shading.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A person page says who they are to others, close ones first
        - Strangers in a photo are hidden in one tap, and come back from the Hidden list
        - A day or a trip has a funny made-up story with its pictures
        - The house's apps open from one menu at the top right
    links:
      - type: satisfies
        target: REQ-STORY-001
      - type: satisfies
        target: REQ-STORY-002
      - type: satisfies
        target: REQ-WEB-027
      - type: satisfies
        target: REQ-WEB-028
      - type: satisfies
        target: REQ-FACE-004
      - type: satisfies
        target: REQ-FACE-005
      - type: satisfies
        target: REQ-NAV-002

  - id: FEAT-019
    type: feature
    title: Live Photos, what came in, better shots, birthdays and events
    status: implemented
    release: v0.12.0
    description: >
      Owner choice 2026-11-24 after comparing lichtbild with Immich and
      others: Live Photos as one item, a Recently added page, a sharpness
      and exposure check, birthday memories, events within trips, and a
      People page that says when faces are still loading. Nothing is
      shared outside the house.
    fields:
      phase: phase-1
      acceptance-criteria:
        - An iPhone Live Photo shows once in the timeline and plays its clip from the viewer
        - Right after a start, People says faces are still loading rather than that there are none
        - A page shows what the last sync brought in, newest first
    links:
      - type: satisfies
        target: REQ-MEDIA-005
      - type: satisfies
        target: REQ-FACE-006
      - type: satisfies
        target: REQ-WEB-029
