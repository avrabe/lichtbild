artifacts:
  - id: FEAT-001
    type: feature
    title: Skeleton - read-only scan, redb index, thumbnails, timeline
    status: implemented
    release: v0.1.0
    description: >
      Step 2 of docs/BRIEF.md. `lichtbild scan` walks each root read-only,
      indexes JPEG, PNG, WebP and GIF with capture date and position and
      their source, writes thumbnails atomically into a bounded cache, and
      reports found, indexed and skipped per root so they reconcile.
      `lichtbild serve` renders the timeline per person or merged under a
      base path, with a same-origin CSP.
    fields:
      phase: phase-1
      acceptance-criteria:
        - cargo test passes, and scripts/planted_faults.py reports every fault caught
        - A scan of a synthetic tree leaves it byte-identical, also when read-only
        - The scan report reconciles found = indexed + skipped per root
    links:
      - type: satisfies
        target: REQ-FAULT-001
      - type: satisfies
        target: REQ-PRIV-001
      - type: satisfies
        target: REQ-CFG-002
      - type: satisfies
        target: REQ-SCAN-002
      - type: satisfies
        target: REQ-SCAN-003
      - type: satisfies
        target: REQ-SCAN-004
      - type: satisfies
        target: REQ-SCAN-005
      - type: satisfies
        target: REQ-META-001
      - type: satisfies
        target: REQ-THUMB-001
      - type: satisfies
        target: REQ-WEB-001
      - type: satisfies
        target: REQ-WEB-004
      - type: satisfies
        target: REQ-WEB-005

  - id: FEAT-002
    type: feature
    title: Timeline navigation - date scrubber and photo viewer
    status: implemented
    release: v0.2.0
    description: >
      Owner request 2026-11-14 after using v0.1.1: jump to a year or month
      instead of scrolling, and step through photos with swipes or arrow
      keys. The home page also shows the merged view's count.
    fields:
      phase: phase-1
      acceptance-criteria:
        - From any month in the rail or menu the timeline starts at that month
        - Swiping left or right in the viewer goes to the next or previous photo
    links:
      - type: satisfies
        target: REQ-WEB-006
      - type: satisfies
        target: REQ-WEB-007

  - id: FEAT-003
    type: feature
    title: HEIC photos in the timeline and viewer
    status: implemented
    release: v0.1.3
    description: >
      The 1,043 iPhone and iPad HEIC photos the first real scan reported as
      "not yet supported (heic)" appear in the timeline, with a JPEG preview
      in the viewer.
    fields:
      phase: phase-1
      acceptance-criteria:
        - The real library's scan reports "decode error (heic)" for at most 2% of HEIC files
    links:
      - type: satisfies
        target: REQ-MEDIA-002

  - id: FEAT-004
    type: feature
    title: Photo details and place names in the viewer
    status: implemented
    release: v0.1.3
    description: >
      Owner request 2026-11-14: a metadata view in the viewer, with the GPS
      position turned into a place name, offline.
    fields:
      phase: phase-1
      acceptance-criteria:
        - The info panel names the nearest town for a photo with GPS when GeoNames files are configured
    links:
      - type: satisfies
        target: REQ-WEB-008
      - type: satisfies
        target: REQ-PLACE-001

  - id: FEAT-005
    type: feature
    title: Login and per-person libraries
    status: implemented
    release: v0.2.0
    description: >
      Step 3 of the brief, moved ahead of the map by the owner: nothing is
      routed to the household before login exists.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A household member signs in with the house identity provider and sees only their own library unless granted more
    links:
      - type: satisfies
        target: REQ-AUTH-001
      - type: satisfies
        target: REQ-AUTH-002
      - type: satisfies
        target: REQ-NAV-001

  - id: FEAT-006
    type: feature
    title: Videos in the timeline
    status: implemented
    release: v0.3.0
    description: >
      Owner request 2026-11-18: the 790 videos the scan reported as "not yet
      supported (video)" appear in the timeline with a poster and their
      length, and play in the viewer. Transcripts follow (v0.4.0).
    fields:
      phase: phase-1
      acceptance-criteria:
        - The real library's scan reports at most 5% of H.264 and HEVC videos as "decode-error (h264)" or "decode-error (hevc)"
    links:
      - type: satisfies
        target: REQ-MEDIA-001

  - id: FEAT-007
    type: feature
    title: World map of photos and videos
    status: implemented
    description: >
      Step 3 of the brief: a map of where photos and videos were taken, with
      tiles from a self-hosted PMTiles file and nothing loaded from outside.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A signed-in person sees their own positioned items, clustered by zoom, on the deployment's PMTiles map, and opens one in the viewer by clicking it
    links:
      - type: satisfies
        target: REQ-MAP-001

  - id: FEAT-008
    type: feature
    title: Transcripts and one search box
    status: implemented
    release: v0.4.0
    description: >
      Owner request 2026-11-18: decode the audio of videos into transcripts
      that can be read and searched.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A word spoken in a household video finds it, and the hit opens the video at that moment
        - The first full pass on the Pi runs at most 2x real time on speech
    links:
      - type: satisfies
        target: REQ-MEDIA-004
      - type: satisfies
        target: REQ-SEARCH-001

  - id: FEAT-009
    type: feature
    title: Duplicates shown once
    status: implemented
    release: v0.5.0
    description: >
      Owner request 2026-11-18: detect the same pictures so they need not be
      seen several times, to hide them per person, and to get a list of
      duplicate files to clean up.
    fields:
      phase: phase-1
      acceptance-criteria:
        - A photo in both libraries, or saved again from a messenger, appears once in the merged timeline
        - What one person hides stays visible to the other
    links:
      - type: satisfies
        target: REQ-DUP-001
      - type: satisfies
        target: REQ-DUP-002
      - type: satisfies
        target: REQ-DUP-003

