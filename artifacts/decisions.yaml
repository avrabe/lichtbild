artifacts:
  - id: DD-001
    type: design-decision
    title: Pin the toolchain to varve's covalent realm
    status: implemented
    release: v0.1.0
    description: >
      rivet comes from the varve covalent layer, locally and in CI, as in haus.
    fields:
      decision: >
        varve.toml pins realm `covalent`, channel rolling, layer 2026.11.10;
        varve-realms.toml carries the pulseengine, pulseengine-wasm and
        covalent roots. CI installs varve from its cosign-verified release and
        runs `varve run -- rivet validate`.
      rationale: >
        The same pin as the other house repos, so a developer and CI run the
        same signed rivet. 2026.11.10 is the newest layer installed here; the
        older 2026.11.7 is refused locally by varve's anti-rollback mark.
      alternatives: >
        `cargo install rivet` (unsigned, unpinned).
    links:
      - type: satisfies
        target: REQ-TRACE-001

  - id: DD-002
    type: design-decision
    title: STPA and STPA-Sec as the analysis, no safety standard
    status: implemented
    release: v0.1.0
    description: >
      lichtbild is a household application with no functional-safety
      standard or integrity level; the losses are of data and privacy.
    fields:
      decision: >
        rivet schemas common, dev, stpa and stpa-sec. Losses and hazards in
        artifacts/safety.yaml, the security half in artifacts/security.yaml,
        requirements link to the constraints with constraint-satisfies
        (system) or satisfies (security).
      rationale: >
        The brief's examples (writing into a source folder, a person seeing
        another's items, a location leaking, silent skips) are integrity and
        confidentiality losses, which STPA and STPA-Sec cover with one shared
        control structure. No DAL, ASIL or SIL applies.
      alternatives: >
        The cybersecurity (ISO 21434) preset, which targets vehicles; the
        EU AI Act schema, to be reconsidered before face recognition lands
        (household personal use is the expected scope).
    links:
      - type: satisfies
        target: REQ-TRACE-001

  - id: DD-003
    type: design-decision
    title: One binary with axum, server-rendered pages and htmx, assets embedded
    status: implemented
    release: v0.1.0
    description: >
      The haus and warte stack: axum, server-rendered HTML, htmx for
      incremental loading, static assets compiled into the binary.
    fields:
      decision: >
        One crate `lichtbild` with subcommands `scan` and `serve`; axum 0.8
        and tokio; HTML from Rust code; htmx vendored and embedded, served
        from the app's own origin.
      rationale: >
        Same deployment shape as haus (one static binary, one unit, base path
        from the environment, the nav v1 switcher rendered server-side), no
        JavaScript build, and embedded assets make the no-outside-request
        rule checkable on the binary itself.
      alternatives: >
        A single-page app with a JSON API (needs a JS toolchain, more surface).
    links:
      - type: satisfies
        target: REQ-WEB-001
      - type: satisfies
        target: REQ-WEB-003
      - type: satisfies
        target: REQ-WEB-002
      - type: satisfies
        target: REQ-NAV-001

  - id: DD-004
    type: design-decision
    title: The index is redb, owned by the serving process
    status: implemented
    release: v0.1.0
    description: >
      Owner decision 2026-11-14: redb, as in the other house apps, no SQLite.
    fields:
      decision: >
        redb 4 with tables for items (JSON records), paths, a per-person
        timeline key (label, taken, id) and a merged one (taken, id), and a
        schema version in a meta table. redb locks its file to one process,
        so `lichtbild serve` owns the index and runs the scan in a
        background thread at start and every LICHTBILD_SCAN_INTERVAL_HOURS;
        `lichtbild scan` opens the index only when no server holds it and
        says so otherwise.
      rationale: >
        Pure Rust (no C in the static musl build), one file in the data
        directory, MVCC reads while the scan writes, and the same store the
        other house apps use. One process also matches the brief's one
        systemd unit.
      alternatives: >
        SQLite through rusqlite (C library; separate scan and serve processes
        could share it); redb's experimental multi-process mode.
    links:
      - type: satisfies
        target: REQ-IDX-001

  - id: DD-005
    type: design-decision
    title: Pure-Rust image decoding first; HEIC and video reported as skipped until decided
    status: implemented
    release: v0.1.0
    description: >
      The skeleton decodes JPEG, PNG, WebP and GIF with the `image` crate and
      reads EXIF with `kamadak-exif`. HEIC and video files are found, counted
      and reported as skipped with reason "unsupported (not yet)".
    fields:
      decision: >
        No native decoder in v0.1.0. The scan report measures how many HEIC
        and video files the library has before choosing between linking
        libheif and ffmpeg, or running them as limited child processes
        (REQ-MEDIA-001).
      rationale: >
        Memory-safe decoding for the first release, static musl builds stay
        simple, and the gap is visible in the scan report instead of silent.
      alternatives: >
        libheif-rs with a bundled build now; ffmpeg child processes now.
    links:
      - type: satisfies
        target: REQ-SCAN-002
      - type: satisfies
        target: REQ-MEDIA-001

  - id: DD-006
    type: design-decision
    title: Source access is confined to one module, enforced by clippy
    status: implemented
    release: v0.1.0
    description: >
      Only `src/source.rs` touches source roots, and it has no write call.
    fields:
      decision: >
        clippy.toml lists std::fs write, create, rename, remove and
        permission functions and OpenOptions as disallowed methods; the data
        directory module allows them locally with a reason. The read-only
        fixture test (REQ-SCAN-001) is the behavioural check. The deployment
        additionally mounts the roots read-only for the service.
      rationale: >
        Three independent layers against a write into a source root: a lint that fails CI on a new
        write call, a test that fails if a scan changes the tree, and an
        operating-system guard outside this repository.
      alternatives: >
        Rely on the deployment's read-only mount alone (one layer, and not
        exercised by CI).
    links:
      - type: satisfies
        target: REQ-SCAN-001

  - id: DD-007
    type: design-decision
    title: CI on the repository's self-hosted runner behind the fail-closed fork guard
    status: implemented
    release: v0.1.0
    description: >
      One self-hosted runner serves this repository (labels light and
      rust-cpu, registered 2026-11-14). CI and hostname-scan jobs run on it
      for pushes, merge groups and same-repository pull requests; pull
      requests from forks run on GitHub-hosted runners.
    fields:
      decision: >
        Every CI job uses `runs-on: (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
        && fromJSON('["self-hosted","linux","x64","<label>"]') ||
        'ubuntu-latest'`, with `light` for rivet validate and hostname-scan
        and `rust-cpu` for the Rust build, test and planted faults. No
        workflow with a self-hosted job has a pull_request_target trigger.
        Release jobs stay GitHub-hosted for signing provenance.
      rationale: >
        Code from a fork never runs on the house's runner; the expression
        falls back to a hosted runner whenever the condition is false.
      alternatives: >
        GitHub-hosted only (no use of the runner); self-hosted without the
        guard (fork code on our machine).
    links:
      - type: satisfies
        target: REQ-TRACE-001

  - id: DD-008
    type: design-decision
    title: The release pipeline is haus's, renamed
    status: implemented
    release: v0.1.0
    description: >
      release.yml follows haus's: version guard, musl builds with
      cargo-zigbuild, binary --version check, SBOM, SHA256SUMS.txt, keyless
      cosign signature verified before publishing, provenance attestation.
    fields:
      decision: >
        Asset names lichtbild-<ver>-linux-arm64, -linux-amd64, -macos-arm64,
        sbom.json, SHA256SUMS.txt and SHA256SUMS.txt.cosign.bundle.
        GitHub-hosted runners, no caches in release jobs.
      rationale: >
        The deployment already pins and verifies haus releases this way, so
        lichtbild needs no new deployment mechanism.
      alternatives: >
        Container images (a second artifact type to verify and run).
    links:
      - type: satisfies
        target: REQ-REL-001

  - id: DD-009
    type: design-decision
    title: Configuration through LICHTBILD_* variables and an optional TOML file
    status: implemented
    release: v0.1.0
    description: >
      The deployment supplies roots, data directory, base path and limits;
      the repository carries config.example.toml with placeholders only.
    fields:
      decision: >
        Environment variables override the file named by LICHTBILD_CONFIG.
        Roots are given as label=path pairs. No default root or data path.
      rationale: >
        The folder layout and person labels are private; having no default
        means a missing setting fails loudly instead of pointing somewhere.
      alternatives: >
        Command-line flags only (secrets and paths end up in process lists).
    links:
      - type: satisfies
        target: REQ-CFG-001

  - id: DD-010
    type: design-decision
    title: Decode HEIC with heic-rs, in process
    status: implemented
    release: v0.1.3
    description: >
      Owner decision 2026-11-14: HEIC with the pure-Rust heic-rs crate
      (MIT OR Apache-2.0), which the owner pointed to.
    fields:
      decision: >
        heic-rs pinned to =0.1.4 with default features off (no rayon), so
        each scan worker decodes on its own thread. One decode produces the
        thumbnail and a 2048 px JPEG preview in the data directory. Dates and
        positions come from kamadak-exif, which reads HEIF containers. A
        decoder panic is caught and counted as a decode error. Before each
        upgrade the crate source diff is read (no build script, no unsafe,
        no network or process use in 0.1.4).
      rationale: >
        Keeps all decoding memory-safe and the release binary
        static with no host packages, unlike libheif linked in or run as a
        child process. Measured on an Apple M4: 75 ms to decode a synthetic
        4032x3024 HEIC, 160 ms with thumbnail and preview.
      alternatives: >
        libheif linked statically (C/C++ codec in process, harder musl
        cross-build); heif-dec or ffmpeg as limited child processes (host
        packages on the Pi and in CI).
      kill-criterion: >
        Fall back to libheif in a child process if, on the real library, more
        than 2% of the 1,043 HEIC files end as "decode error (heic)", or
        their thumbnails are visibly wrong.
    links:
      - type: satisfies
        target: REQ-MEDIA-002

  - id: DD-011
    type: design-decision
    title: Town names from GeoNames files, looked up in memory
    status: implemented
    release: v0.1.3
    description: >
      Owner decision 2026-11-14: town-level place names, offline, rather than
      street addresses from a local geocoding service or none.
    fields:
      decision: >
        LICHTBILD_PLACES names a GeoNames cities file (cities1000.txt, about
        10 MB, CC-BY 4.0), with optional admin1CodesASCII.txt and
        countryInfo.txt. lichtbild loads it at start into a one-degree grid
        and returns the nearest town by great-circle distance. The deployment
        downloads a snapshot and pins its sha256.
      rationale: >
        A photo's position must not leave the house, which rules out online
        geocoders. Town level fits in memory on the Pi and needs no second
        service; street level would need Photon or Nominatim with gigabytes
        of OpenStreetMap data.
      alternatives: >
        A local Photon or Nominatim service (street addresses, several GB per
        country); coordinates only.
    links:
      - type: satisfies
        target: REQ-PLACE-001

  - id: DD-012
    type: design-decision
    title: Photo details are read from the original when the viewer opens
    status: implemented
    release: v0.1.3
    description: >
      Camera, lens and exposure are not stored in the index.
    fields:
      decision: >
        The viewer reads the original (read-only, under the file size limit)
        and extracts the EXIF fields with kamadak-exif for the info panel.
      rationale: >
        No index change and no rescan of the 31,000-file library; one file
        read per photo opened is cheap on the local disk.
      alternatives: >
        Store the fields in the index (needs a schema change and a full
        rescan).
    links:
      - type: satisfies
        target: REQ-WEB-008

  - id: DD-013
    type: design-decision
    title: OIDC code flow with PKCE via openidconnect, sessions in memory
    status: implemented
    release: v0.2.0
    description: >
      Login against the house identity provider with the openidconnect crate;
      the deployment (smithy) creates the client and supplies its secret.
    fields:
      decision: >
        openidconnect 4 (reqwest with rustls, no redirects followed, optional
        extra CA bundle for a provider behind a private CA). Discovery on
        first use; keys fetched once more if a token fails verification, in
        case the provider rotated them. Pending logins (state, nonce, PKCE
        verifier) and sessions are kept in memory: pending ones for 10
        minutes, sessions for 30 days. The client secret comes from a file,
        never an environment value. People and grants are in the deployment's
        TOML file.
      rationale: >
        One process with no session store to run; a restart costs one silent
        round trip to the provider. PKCE plus a confidential client and nonce
        checks cover code interception and token replay.
      alternatives: >
        Authentication in the reverse proxy (forward auth), which would leave
        lichtbild unaware of who is looking and unable to scope per person;
        signed stateless session cookies (more key handling for no gain here).
    links:
      - type: satisfies
        target: REQ-AUTH-001
      - type: satisfies
        target: REQ-AUTH-002

  - id: DD-014
    type: design-decision
    title: The nav module is haus's, unchanged
    status: implemented
    release: v0.2.0
    description: >
      src/nav.rs is haus-core's nav.rs (avrabe/loriot-websocket-mcp at
      d9bd323) with its tests, including warte's refusal table.
    fields:
      decision: >
        Copy rather than rewrite, and keep the tests identical, so lichtbild
        accepts and refuses exactly the files haus and warte do.
      rationale: >
        One contract, three apps: a second implementation would drift. The
        warte binary on the development machine (1.6.20) predates the nav
        topic, so haus's implementation and tests are the reference here.
      alternatives: >
        A shared crate for the house apps (worth it once a third Rust app
        renders the nav).
    links:
      - type: satisfies
        target: REQ-NAV-001

  - id: DD-015
    type: design-decision
    title: The timeline orders by the camera's local time, not UTC
    status: implemented
    release: v0.2.1
    description: >
      Items sort by taken_local, the wall-clock time the camera recorded.
      taken_offset is stored, but it does not change the order (issue #4).
    fields:
      decision: >
        Keep local wall-clock order and the day headers it gives: a photo
        taken at 23:30 on holiday stays on that evening's day, wherever the
        viewer is.
      rationale: >
        Many items carry no offset at all: older cameras, scans, names that
        carry only a date, and stills from a camera next to a phone. Sorting
        by UTC where an offset exists and by local time where it does not
        would order one timeline on two clocks, which is worse than the rare
        interleaving of photos from two time zones on one travel day. Day
        grouping by UTC would also move evening photos to the next day.
      alternatives: >
        UTC order with local day headers, once nearly every item has an
        offset; it needs an index migration of by_root and by_time.
    links:
      - type: satisfies
        target: REQ-WEB-001

  - id: DD-016
    type: design-decision
    title: Video posters in pure Rust, decoded in a limited child process
    status: implemented
    release: v0.3.0
    description: >
      Owner decision 2026-11-18, after a survey of the crates: pure Rust for
      video, with ffmpeg only as a measured fallback.
    fields:
      decision: >
        A small box walk finds moov (capped at 64 MiB) and the video track;
        mp4-atom =0.17.1 decodes mvhd, tkhd and mdia. Apple keys, ©xyz and
        mvhd give date and position (nom-exif was tried and found neither
        the Apple keys nor ©xyz in the fixtures). The first sync sample
        (capped at 64 MiB) is decoded by rust_h264 =0.6.1 or rust_h265
        =0.4.1. Both contain unsafe code (SIMD kernels, frame-threading
        tables), so decoding runs in `lichtbild decode-keyframe`, a child
        process with a cleared environment, a 60 s wall-clock timeout, a
        60 s CPU limit and on Linux an address-space limit; a crash, hang or
        bad output costs only that poster. Originals are served with single
        byte ranges for seeking; nothing is transcoded.
      rationale: >
        Keeps the release one static binary with no host packages, and keeps
        unsafe decoder code out of the server and scan process.
        Posters match ffmpeg 9.0.1 within 2 levels per channel on the
        synthetic fixtures, rotation included.
      alternatives: >
        ffmpeg or ffprobe as child processes (host package on the Pi and in
        CI); ffmpeg linked in (C in process); decoding in a thread (no way to
        stop a hang, unsafe code in process); transcoding HEVC for browsers
        that cannot play it (CPU on the Pi, a second copy of every video).
      kill-criterion: >
        Add an ffmpeg child-process fallback for posters if, on the real
        library, more than 5% of the H.264 and HEVC videos end as
        "decode-error (h264)" or "decode-error (hevc)", or their posters are
        visibly wrong.
    links:
      - type: satisfies
        target: REQ-MEDIA-001

  - id: DD-017
    type: design-decision
    title: World map with vendored MapLibre (CSP build), one PMTiles file and server-side clusters
    status: implemented
    description: >
      The map (step 3 of the brief) runs entirely from lichtbild's origin.
    fields:
      decision: >
        MapLibre GL JS 5.24.1 in its CSP build, pmtiles 4.5.0 and
        @protomaps/basemaps 5.7.2 are embedded like htmx, byte-for-byte as
        released, with their sha256 pinned in a test and assets/VENDORED.md.
        The CSP build loads its worker from a same-origin file, so the CSP
        needs no blob:, worker-src or unsafe-eval; MapLibre's data: control
        icons are replaced in lichtbild.css. The PMTiles file is served with
        the same single-range code as originals. Clusters are computed in
        Rust on a Web Mercator grid of 64-pixel cells per zoom over an
        in-memory list of positioned items, rebuilt when the index's
        generation changes and filtered by the viewer's libraries on every
        request; clusters of up to 12 items (and every cluster from zoom 16)
        list their newest items with thumbnail URLs, shown as markers.
      rationale: >
        The brief requires that no request leaves the house. 31,000 items
        cluster in a few milliseconds, and computing clusters on the server
        keeps the scoping in one place next to the timeline's instead of
        sending every position to the browser.
      alternatives: >
        MapLibre 6 (ES modules only, no CSP bundle); the standard MapLibre
        bundle with blob: workers allowed in the CSP; clustering in the
        browser with a GeoJSON source (needs glyphs for counts and ships all
        positions); a tile server process next to lichtbild.
      kill-criterion: >
        Move to MapLibre 6 module workers when the 5.x line stops getting
        fixes, keeping the CSP 'self' only.
    links:
      - type: satisfies
        target: REQ-MAP-001

  - id: DD-018
    type: design-decision
    title: Whisper base with candle, in a limited child process
    status: implemented
    release: v0.4.0
    description: >
      Owner decision 2026-11-18 after a spike (spikes/stt-bench on branch
      spike/stt-bench): pure-Rust Whisper if base runs at most 2x real time
      on the Pi 5. Measured there at 1.2 to 1.7.
    fields:
      decision: >
        candle 0.11.1 with Whisper base (openai/whisper-base refs/pr/22,
        SHA-256 pinned), audio by symphonia (AAC, MP3, PCM) and rubato, run
        as `lichtbild transcribe` with a cleared environment, a wall-clock
        timeout of six times the audio plus a minute, RLIMIT_CPU and on
        Linux RLIMIT_AS. Compared to candle's example: language per 30 s
        window (optionally among configured codes); energy VAD; compression
        ratio computed; early cut of token loops; three fallback
        temperatures; windows still below the log-probability threshold
        dropped; resume at the last timestamp; the first timestamp must be
        followed by text (candle's example forced a second timestamp and
        skipped 30 s windows) and lie within 1 s; nothing past the audio;
        stock subtitle phrases and echoed lines dropped. Transcription
        runs after the scan, not beside it (about 600 MB resident).
      rationale: >
        One static binary, no host packages, decoder code out of the
        server process. Open media, base on an M4: LibriVox Kafka (German,
        language detected) WER 33% (example as shipped: 99% from a wrong
        language, 42% with German forced), Tears of Steel 35% (57%).
      alternatives: >
        whisper.cpp as a child process (C++ build per target); whisper-rs
        linked in; sherpa-onnx or ONNX Runtime (C++); a glibc build would
        run about 1.3x faster than the static musl one.
      kill-criterion: >
        Move to whisper.cpp in a child process if on the Pi the first full
        pass runs slower than 2x real time on speech, or if the owner finds
        transcripts of household videos mostly wrong.
    links:
      - type: satisfies
        target: REQ-MEDIA-004

  - id: DD-019
    type: design-decision
    title: Search with tantivy in memory, rebuilt from the index
    status: implemented
    release: v0.4.0
    description: >
      Owner choice 2026-11-18: tantivy over a word table in redb.
    fields:
      decision: >
        tantivy 0.27 without default features (lz4 only, no C), an index
        in RAM rebuilt by the scan thread at start, after each scan and
        after each transcription pass: one document per live item, one per
        transcript line. Lower case and ASCII folding, no stemming (German
        and English mixed). The label filter is part of the query, and each
        hit is checked against the scope again.
      rationale: >
        Rebuilding 31,000 items and their transcripts takes seconds and
        keeps the index the only state on disk: nothing new to back up,
        migrate or write outside the data directory module.
      alternatives: >
        A persistent tantivy directory (writes outside datadir.rs, a second
        store to keep in step); a word table in redb (no ranking).
    links:
      - type: satisfies
        target: REQ-SEARCH-001

  - id: DD-020
    type: design-decision
    title: Duplicates by content hash and a thumbnail difference hash
    status: implemented
    release: v0.5.0
    description: >
      Owner request 2026-11-18: detect the same pictures and stop showing
      them more than once; similar pictures (bursts, angles) come later.
    fields:
      decision: >
        Exact copies share the blake3 content hash the index already holds.
        The same picture in another file: a 64-bit difference hash (9x8
        grey) of the thumbnail in the data directory, computed once per
        content after each scan and stored in redb; flat pictures get none.
        Two pictures are the same when at most 6 bits differ, the aspect
        ratio agrees within 3 %, both are photos or both videos, and one of
        these holds: one has no camera date, the sizes differ by more than
        10 %, or the same second in two formats. Each copy joins only its
        nearest match, so a burst is not pulled together through a copy.
        Candidates come from eight 8-bit bands of the hash. Groups live in
        memory, rebuilt after each scan; which copy shows is decided per
        request among the libraries the viewer may see.
      rationale: >
        No original is read again and no new dependency is needed. The
        evidence rule keeps two camera originals apart, which is the line
        between a duplicate and a similar picture.
      alternatives: >
        Image embeddings (v0.6, also for similar pictures); a perceptual
        hash over the original (reads every file again).
      kill-criterion: >
        Revisit if the owner finds two different photos shown as one, or
        copies of a messenger photo still shown twice.
    links:
      - type: satisfies
        target: REQ-DUP-001
  - id: DD-021
    type: design-decision
    title: Sessions are stored by hash, so an upgrade does not sign anyone out
    status: implemented
    release: v0.4.1
    description: >
      smithy, 0.4.0 live: after the restart for the upgrade every session
      was gone, and pages kept by the browser showed no thumbnails.
    fields:
      decision: >
        Besides memory, each session is stored in the redb index as the
        SHA-256 of its id with the person's label, the identity they signed
        in with (subject, or verified email) and an expiry (30 days). A
        session not in memory is looked up there, under the same lock
        sign-out takes; it counts only if the configured person with that
        label still has that identity, and their libraries are worked out
        again from the current configuration. Sign-out removes the stored
        session first and reports a failure; expired ones go when a new one
        is stored. Pages are sent with "Cache-Control: no-cache, private", and
        a thumbnail that fails with a redirect reloads the page.
      rationale: >
        Upgrades are frequent; signing the household out each time, and the
        empty tiles of a kept page, are the worse failure. The index already
        holds everything about the library; a session hash adds no secret.
      alternatives: >
        Signed cookies with a server key (key management, no sign-out);
        sessions in memory only (sign-out on every restart).
    links:
      - type: satisfies
        target: REQ-AUTH-001

