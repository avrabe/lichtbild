[package]
name = "lichtbild"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "lichtbild: the household's own photo and video library, as one binary"
repository = "https://github.com/avrabe/lichtbild"
license = "Apache-2.0"
publish = false

[[bin]]
name = "lichtbild"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
heic-rs = { version = "=0.1.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.6"
libc = "0.2"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mp4-atom = "=0.17.1"
rust_h264 = { version = "=0.6.1", default-features = false, features = ["std"] }
rust_h265 = "=0.4.1"
candle = { package = "candle-core", version = "=0.11.1" }
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
miniz_oxide = "0.8"
rand = "0.9"
rubato = "5"
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "aac", "mp3", "wav", "pcm"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tantivy = { version = "=0.27.0", default-features = false, features = ["lz4-compression"] }

[dev-dependencies]
base64 = "0.22"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Dependencies (image decoding, hashing) optimised in test builds too.
[profile.dev.package."*"]
opt-level = 2
