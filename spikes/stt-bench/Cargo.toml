# Spike for v0.4.0 transcripts (REQ-MEDIA-004 to come): how fast does pure-Rust
# Whisper (candle) transcribe household video on the Raspberry Pi?
# Not part of the lichtbild binary or its release. See README.md.
[package]
name = "stt-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
byteorder = "1"
candle = { package = "candle-core", version = "=0.11.1" }
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
rand = "0.9"
rubato = "5"
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["isomp4", "aac", "mp3", "wav", "pcm"] }
mimalloc = { version = "0.1", optional = true, default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
# A/B the allocator: musl's malloc is slow under allocation-heavy loads.
mimalloc = ["dep:mimalloc"]
