name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with release.yml and rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.96.1
  # varve itself; the tools (rivet) come from the layer varve.toml pins.
  VARVE_VERSION: v0.47.0

# Self-hosted with the fail-closed fork guard (DD-007): a pull request from
# a fork always runs on ubuntu-latest. Light jobs take `light`, Rust builds
# take `rust-cpu`. This workflow has no pull_request_target trigger.
jobs:
  # clippy.toml's disallowed-methods is the lint layer of DD-006.
  check:
    name: fmt, clippy, test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Whisper tiny for tests/transcribe.rs, pinned and checked by SHA-256.
      - name: Fetch the test model
        run: scripts/fetch-test-model.sh "$RUNNER_TEMP/whisper-tiny"

      - name: cargo test
        env:
          LICHTBILD_TEST_WHISPER_DIR: ${{ runner.temp }}/whisper-tiny
        run: cargo test --locked --no-fail-fast

  # The release build steps on every PR, so release.yml is not first run at
  # the tag (the v0.1.0 run failed on a toolchain conflict CI never saw).
  # Same toolchain install as release.yml: no components, musl target.
  # rivet: verifies REQ-REL-001
  release-build:
    name: release build (dry run)
    # GitHub-hosted on purpose: a fresh toolchain install, as in release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_ZIGBUILD_VERSION: 0.24.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl

      - name: Install cargo-zigbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Build (zigbuild)
        run: cargo zigbuild --locked --release -p lichtbild --target x86_64-unknown-linux-musl

      - name: Check binary version and linkage
        run: |
          bin=target/x86_64-unknown-linux-musl/release/lichtbild
          want="lichtbild $(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "lichtbild") | .version')"
          got="$("$bin" --version)"
          test "$got" = "$want" || { echo "::error::binary reports '$got', expected '$want'"; exit 1; }
          file "$bin" | tee /dev/stderr | grep -q 'statically linked'

  # REQ-FAULT-001: every check must fail with its planted fault.
  # rivet: verifies REQ-FAULT-001
  planted-faults:
    name: planted faults
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-latest' }}
    # 96 faults at about a minute each on a busy runner (one run hit 60 min
    # at F58); each fault rebuilds and runs one test.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fetch the test model
        run: scripts/fetch-test-model.sh "$RUNNER_TEMP/whisper-tiny"

      - name: Plant each fault and expect its check to fail
        env:
          LICHTBILD_TEST_WHISPER_DIR: ${{ runner.temp }}/whisper-tiny
        run: python3 scripts/planted_faults.py

  # rivet: verifies REQ-TRACE-001
  # rivet: verifies DD-001
  rivet:
    name: rivet validate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install varve (verified)
        run: |
          cd "$RUNNER_TEMP"
          B="https://github.com/pulseengine/varve/releases/download/${VARVE_VERSION}"
          curl -fsSLO "$B/install.sh"
          curl -fsSLO "$B/SHA256SUMS.txt"
          curl -fsSLO "$B/SHA256SUMS.txt.cosign.bundle"
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/pulseengine/varve/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum -c --ignore-missing SHA256SUMS.txt | grep -qx './install.sh: OK'
          VARVE_INSTALL_DIR="$RUNNER_TEMP/varve/bin" sh install.sh --version "$VARVE_VERSION"
          echo "$RUNNER_TEMP/varve/bin" >> "$GITHUB_PATH"

      - name: Install the pinned layer
        run: |
          varve --version
          varve install
          varve which rivet

      # Warnings fail the job: the trace graph grows closed (bootstrap-verification).
      - name: rivet validate
        run: |
          set -o pipefail
          varve run -- rivet validate | tee "$RUNNER_TEMP/rivet.txt"
          grep -q '^Result: PASS (0 warnings)' "$RUNNER_TEMP/rivet.txt"
